<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>อิสลาม เสาหลัก 5 ประการ — ติวไทย/อังกฤษ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- ============================================================
     widget-template.html — ก๊อปไฟล์นี้ทั้งไฟล์เพื่อขึ้น widget ใหม่
     สไตล์ inline มาให้แล้ว (ไฟล์เดียวจบ ส่งเพื่อน/เปิดเดี่ยวได้)
     1) เปลี่ยน data-subject ที่ <body> ให้ตรงวิชา -> สีเปลี่ยนทั้งหน้า
        physics | bio | chem | christ | islam | history | math | eng | thai
     2) แก้ <title> + header + เนื้อในแท็บ
     3) ต้นฉบับสไตล์ = ../_kit/design-tokens.css (แก้ที่นั่นถ้าจะเปลี่ยนมาตรฐานกลาง)
     ============================================================ -->
<style>
/* ===== TOKENS (สำเนาจาก design-tokens.css — ดูคำอธิบายเต็มที่ไฟล์นั้น) ===== */
:root{
  --font:'Sarabun','Noto Sans Thai',system-ui,-apple-system,sans-serif;
  --bg:#eef2f7;--ink:#1e293b;--muted:#64748b;--line:#e2e8f0;--card:#fff;--soft:#f8fafc;
  --shadow:0 1px 4px rgba(15,23,42,.08);
  --ok:#059669;--bad:#dc2626;
  --warn-bg:#fff7ed;--warn-bd:#f97316;--tip-bg:#ecfdf5;--tip-bd:#10b981;
  --info-bg:#eff6ff;--info-bd:#3b82f6;--steps-bg:#fffbeb;--steps-bd:#fcd34d;--steps-dash:#fde68a;
  --hot-bg:#fee2e2;--hot-ink:#b91c1c;--badge-bg:#fef9c3;--badge-ink:#854d0e;
  --radius:14px;--radius-sm:10px;--radius-pill:999px;
  --accent:#4f46e5;--accent-head:#312e81;--accent-ink:#3730a3;--accent-soft:#eef2ff;
  --accent-bd:#c7d2fe;--accent-chip:#e0e7ff;--accent-ghost:#a5b4fc;
}
body[data-subject="physics"]{--accent:#4f46e5;--accent-head:#312e81;--accent-ink:#3730a3;--accent-soft:#eef2ff;--accent-bd:#c7d2fe;--accent-chip:#e0e7ff;--accent-ghost:#a5b4fc;--bg:#eef2f7}
body[data-subject="bio"]{--accent:#16a34a;--accent-head:#14532d;--accent-ink:#166534;--accent-soft:#f0fdf4;--accent-bd:#bbf7d0;--accent-chip:#dcfce7;--accent-ghost:#86efac;--bg:#f0f4ef}
body[data-subject="chem"]{--accent:#ea7317;--accent-head:#7c3a06;--accent-ink:#c2560c;--accent-soft:#fff7ed;--accent-bd:#fed7aa;--accent-chip:#ffedd5;--accent-ghost:#fdba74;--bg:#f6f2ec}
body[data-subject="christ"]{--accent:#7c3aed;--accent-head:#4c1d95;--accent-ink:#6d28d9;--accent-soft:#f5f3ff;--accent-bd:#ddd6fe;--accent-chip:#ede9fe;--accent-ghost:#c4b5fd;--bg:#f2eff7}
body[data-subject="islam"]{--accent:#0d9488;--accent-head:#134e4a;--accent-ink:#0f766e;--accent-soft:#f0fdfa;--accent-bd:#99f6e4;--accent-chip:#ccfbf1;--accent-ghost:#5eead4;--bg:#eef4f2}
body[data-subject="history"]{--accent:#b45309;--accent-head:#78350f;--accent-ink:#92400e;--accent-soft:#fffbeb;--accent-bd:#fde68a;--accent-chip:#fef3c7;--accent-ghost:#fcd34d;--bg:#f5f1e8}
body[data-subject="math"]{--accent:#0284c7;--accent-head:#0c4a6e;--accent-ink:#0369a1;--accent-soft:#f0f9ff;--accent-bd:#bae6fd;--accent-chip:#e0f2fe;--accent-ghost:#7dd3fc;--bg:#edf3f7}
body[data-subject="eng"]{--accent:#db2777;--accent-head:#831843;--accent-ink:#be185d;--accent-soft:#fdf2f8;--accent-bd:#fbcfe8;--accent-chip:#fce7f3;--accent-ghost:#f9a8d4;--bg:#f7eef3}
body[data-subject="thai"]{--accent:#dc2626;--accent-head:#7f1d1d;--accent-ink:#b91c1c;--accent-soft:#fef2f2;--accent-bd:#fecaca;--accent-chip:#fee2e2;--accent-ghost:#fca5a5;--bg:#f7efef}

/* ===== COMPONENTS ===== */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:10px 12px 60px}
header{padding:18px 4px 6px}
header h1{font-size:1.35rem;color:var(--accent-head)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--accent-chip);color:var(--accent-ink);border-radius:var(--radius-pill);padding:3px 12px;font-size:.82rem;font-weight:600}
.chip.hot{background:var(--hot-bg);color:var(--hot-ink)}
.badge{display:inline-block;background:var(--badge-bg);color:var(--badge-ink);border-radius:6px;padding:1px 8px;font-size:.78rem;font-weight:700;vertical-align:middle}
.tabs{display:flex;gap:8px;overflow-x:auto;position:sticky;top:0;background:var(--bg);padding:10px 2px;z-index:10;-webkit-overflow-scrolling:touch}
.tab-btn{white-space:nowrap;padding:8px 14px;border-radius:var(--radius-pill);border:1.5px solid var(--accent-bd);background:#fff;color:var(--accent-ink);cursor:pointer;font-size:.92rem;font-family:inherit;font-weight:600;flex-shrink:0}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab{display:none}
.tab.show{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card h2{font-size:1.15rem;color:var(--accent-head);margin-bottom:2px}
.card h3{font-size:1.05rem;color:var(--ink);margin-bottom:6px}
.sub{color:var(--muted);font-size:.85rem;margin-bottom:10px}
details.concept{border:1px solid var(--line);border-radius:var(--radius-sm);margin:8px 0;overflow:hidden}
details.concept summary{padding:10px 14px;cursor:pointer;font-weight:600;background:var(--soft);list-style:none}
details.concept summary::before{content:"▸ ";color:var(--accent)}
details.concept[open] summary::before{content:"▾ "}
details.concept .body{padding:10px 14px;border-top:1px solid var(--line);font-size:.95rem}
.formula{background:var(--accent-soft);border-radius:8px;padding:6px 12px;display:inline-block;margin:4px 4px 4px 0;font-weight:600;color:var(--accent-ink)}
.warn{background:var(--warn-bg);border-left:4px solid var(--warn-bd);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:.92rem}
.tip{background:var(--tip-bg);border-left:4px solid var(--tip-bd);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:.92rem}
.btn{background:var(--accent);color:#fff;border:0;border-radius:var(--radius-sm);padding:10px 16px;font-size:.95rem;cursor:pointer;font-family:inherit;font-weight:600}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent-ghost)}
.btn.small{padding:6px 12px;font-size:.85rem}
.btn.green{background:var(--ok)}.btn.red{background:var(--bad)}
.seg{display:inline-flex;border:1.5px solid var(--accent-bd);border-radius:var(--radius-sm);overflow:hidden;margin:4px 0;flex-wrap:wrap}
.seg button{border:0;background:#fff;padding:8px 12px;cursor:pointer;font-family:inherit;font-size:.9rem;color:var(--accent-ink)}
.seg button.on{background:var(--accent);color:#fff}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.slider-row{margin:8px 0}.slider-row label{font-size:.92rem;font-weight:600}
.slider-val{color:var(--accent);font-weight:700}
.big-val{font-size:1.3rem;font-weight:700;color:var(--accent);margin:6px 0}
.q-text,.tf-q{font-size:1rem;background:var(--soft);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:6px}
.ans-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 4px}
.ans-in{flex:1;min-width:120px;padding:10px 12px;border:2px solid #cbd5e1;border-radius:var(--radius-sm);font-size:1rem;font-family:inherit}
.ans-in:focus{outline:none;border-color:var(--accent)}
.ans-unit{font-weight:700;color:#475569;min-width:24px}
.fb{margin:6px 0;font-weight:600;min-height:1.2em}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.hint-box div{background:var(--info-bg);border-left:4px solid var(--info-bd);padding:8px 12px;margin:6px 0;border-radius:6px;font-size:.93rem}
.drill-btns,.tf-btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.tf-btns .btn{flex:1;max-width:140px}
.score{margin-top:8px;color:var(--muted);font-size:.88rem}
.steps{background:var(--steps-bg);border:1px solid var(--steps-bd);border-radius:var(--radius-sm);padding:12px 14px;margin:8px 0;display:none;font-size:.95rem}
.steps.show{display:block}
.steps .st{padding:4px 0;border-bottom:1px dashed var(--steps-dash)}
.steps .st:last-child{border-bottom:0}
table.ref{border-collapse:collapse;width:100%;font-size:.9rem;margin:8px 0}
table.ref th,table.ref td{border:1px solid var(--line);padding:6px 10px;text-align:center}
table.ref th{background:var(--accent-soft);color:var(--accent-ink)}
svg{max-width:100%;height:auto;display:block}
.svg-box{background:var(--soft);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px;margin:8px 0}
select{padding:8px;border:1.5px solid #cbd5e1;border-radius:8px;font-family:inherit;font-size:.9rem;background:#fff}
sup,sub{font-size:.72em}
@media(max-width:480px){.card{padding:12px}header h1{font-size:1.15rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<!-- ▼▼ เปลี่ยน data-subject ให้ตรงวิชา = สีเปลี่ยนทั้งหน้า ▼▼ -->
<body data-subject="islam">
<div class="wrap">

  <header>
    <h1><span data-th="☪️ เสาหลัก 5 ประการ — ติวก่อนสอบ" data-en="☪️ The Five Pillars — Exam Review"></span></h1>
    <div class="chips">
      <span class="chip hot" data-th="สอบศุกร์ 21 ส.ค." data-en="Exam Fri 21 Aug"></span>
      <span class="chip" data-th="ครบทั้ง 5 เสา" data-en="All five pillars"></span>
      <button class="btn small" id="langBtn" style="margin-left:auto">EN</button>
    </div>
    <div class="warn" style="margin-top:10px">
      <span data-th="⚠️ อาจารย์ออกข้อสอบเป็นภาษาอังกฤษ แต่เราเรียนมาเป็นไทย — กดปุ่มมุมขวาสลับภาษาแล้วลองอ่านซ้ำเป็นอังกฤษดู"
            data-en="⚠️ The exam is in English but you studied in Thai — use the button to switch and re-read everything in the other language."></span>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab-btn" data-tab="t1"><span data-th="🏛️ ภาพรวม" data-en="🏛️ Overview"></span></button>
    <button class="tab-btn" data-tab="t2"><span data-th="🕌 ละหมาด" data-en="🕌 Salah"></span></button>
    <button class="tab-btn" data-tab="t3"><span data-th="💰 ซะกาต" data-en="💰 Zakat"></span></button>
    <button class="tab-btn" data-tab="t4"><span data-th="🌙 ถือศีลอด" data-en="🌙 Sawm"></span></button>

    <button class="tab-btn" data-tab="t6"><span data-th="📚 ศัพท์" data-en="📚 Glossary"></span></button>
  </nav>

  <!-- ================= แท็บ 1 ภาพรวม ================= -->
  <section id="t1" class="tab">
    <div class="card">
      <h2><span data-th="คำสอนอิสลามแบ่ง 3 หมวด" data-en="Three categories of Islamic teaching"></span></h2>
      <p class="sub" data-th="แตะการ์ดเพื่อดูว่าหมวดไหนคือเสาหลัก 5" data-en="Tap a card to see which one holds the Five Pillars"></p>
      <div id="catRow" class="ans-row" style="flex-wrap:wrap"></div>
      <div class="fb" id="catFb"></div>
    </div>

    <div class="card">
      <h3><span data-th="เสาทั้ง 5" data-en="The Five Pillars"></span></h3>
      <table class="ref"><thead><tr>
        <th>#</th>
        <th data-th="ชื่ออาหรับ" data-en="Arabic name"></th>
        <th data-th="คือ" data-en="What it is"></th>
      </tr></thead><tbody id="pillarBody"></tbody></table>
      <div class="tip" style="margin-top:10px">
        <span data-th="✅ ครบทั้ง 5 เสาแล้ว — สไลด์ฮัจญ์มาถึง 14 ส.ค. 2026 รวม 7 ไฟล์ 414 หน้า กดแท็บ 🕋 ฮัจญ์ ได้เลย"
              data-en="✅ All five pillars are covered — the Hajj decks arrived on 14 Aug 2026 (7 files, 414 slides). See the 🕋 Hajj tab."></span>
      </div>
    </div>

    <div class="card">
      <h3><span data-th="ชะฮาดะฮ์ — องค์ประกอบ 3 ประการ" data-en="Shahada — the three components"></span></h3>
      <p class="sub" data-th="ลากไม่ได้ แต่แตะให้ครบทั้ง 3 อันสิ" data-en="Tap all three to complete it"></p>
      <div id="shaRow" class="ans-row" style="flex-wrap:wrap"></div>
      <div class="fb" id="shaFb"></div>
      <div class="tip" style="margin-top:10px">
        <span data-th="💡 ท่องสั้น ๆ ว่า วาจา–ใจ–กาย" data-en="💡 Remember: speech – heart – body"></span>
      </div>
    </div>
  </section>

  <!-- ================= แท็บ 2 ละหมาด ================= -->
  <section id="t2" class="tab">
    <div class="card">
      <h3><span data-th="5 เวลา กี่ร็อกอะฮ์" data-en="Five daily prayers — how many rak'ah?"></span></h3>
      <p class="sub" data-th="เติมจำนวนร็อกอะฮ์ให้ครบ แล้วกดตรวจ" data-en="Fill in the rak'ah counts, then check"></p>

        <th data-th="ร็อกอะฮ์" data-en="Rak'ah"></th>
      </tr></thead><tbody id="salahBody"></tbody></table>
      <div class="ans-row">
        <button class="btn" id="salahCheck" data-th="ตรวจ" data-en="Check"></button>
        <button class="btn ghost small" id="salahHint" data-th="ขอคำใบ้" data-en="Hint"></button>
      </div>
      <div class="fb" id="salahFb"></div>
      <div class="hint-box" id="salahHintBox" style="display:none">
        <span data-th="รวมทั้งวัน 17 ร็อกอะฮ์ · มีสองเวลาที่ไม่ใช่ 4" data-en="17 rak'ah in total · only two of them are not 4"></span>
      </div>
    </div>

    <div class="card">
      <h3><span data-th="3 ช่วงเวลาที่ห้ามละหมาด" data-en="The three forbidden prayer times"></span></h3>

      <div class="fb" id="forbidFb"></div>

      </div>
    </div>

    <div class="card">

        <div class="body">
          <p data-th="ฟัรฎู = บังคับ ไม่ทำเป็นบาปใหญ่ · ซุนนะฮ์ = สมัครใจ ทำได้บุญ ไม่ทำไม่บาป"
             data-en="Fard = obligatory, skipping it is a major sin · Sunnah = voluntary, rewarded but not sinful to skip"></p>
          <p data-th="ฟัรฎุอัยน์ (Fard al-Ayn) = หน้าที่ส่วนบุคคล เช่น ละหมาด 5 เวลา · ญุมอะฮ์"
             data-en="Fard al-Ayn = individual duty, e.g. the five daily prayers, Jumu'ah"></p>
          <p data-th="ฟัรฎูกิฟายะฮ์ (Fard Kifaya) = หน้าที่รายกลุ่ม มีคนทำแล้วคนอื่นพ้นผิด เช่น ละหมาดญะนาซะฮ์ — แต่ถ้าไม่มีใครทำเลย บาปทั้งชุมชน"

  document.querySelectorAll('[data-th-ph]').forEach(el=>{
    el.placeholder = LANG==='th' ? el.dataset.thPh : el.dataset.enPh;
  });

}

/* ================= ตัวช่วยสร้าง UI ================= */
function chipBtn(label, cls){
  const b=document.createElement('button');
  b.className='btn ghost small'+(cls?' '+cls:'');
  b.textContent=label; b.style.margin='4px';
  return b;
}
function setFb(el,msg,ok){ el.textContent=msg; el.className='fb '+(ok?'ok':'bad'); }

/* ---- แท็บ 1 ---- */
function renderCats(){
  const row=document.getElementById('catRow'), fb=document.getElementById('catFb');
  row.innerHTML=''; fb.textContent=''; fb.className='fb';
  CATS.forEach(c=>{
    const b=chipBtn(T(c));
    b.textContent = LANG==='th'? c.th : c.en;
    b.onclick=()=>{ setFb(fb, T(c.why), c.ok); };
    row.appendChild(b);
  });
}
function renderPillars(){
  const tb=document.getElementById('pillarBody'); tb.innerHTML='';
  PILLARS.forEach((p,i)=>{
    const d = LANG==='th'? p.th : p.en;
    tb.insertAdjacentHTML('beforeend',
      '<tr><td>'+(i+1)+'</td><td><b>'+p.ar+'</b><br><span class="sub">'+d[0]+'</span></td><td>'+d[1]+'</td></tr>');
  });
}
function renderSha(){
  const row=document.getElementById('shaRow'), fb=document.getElementById('shaFb');
  row.innerHTML=''; fb.textContent=''; fb.className='fb';
  let got=0;
  SHA.forEach(s=>{
    const b=chipBtn(LANG==='th'? s.th : s.en);
    b.onclick=()=>{
      if(b.disabled) return;
      if(s.ok){ b.classList.add('green'); b.disabled=true; got++;
        setFb(fb, got===3 ? (LANG==='th'?'✓ ครบทั้ง 3 แล้ว — วาจา ใจ กาย':'✓ All three: speech, heart, body')
                          : (LANG==='th'?'✓ ถูก เหลืออีก '+(3-got):'✓ Correct — '+(3-got)+' to go'), true);
      } else { b.classList.add('red');
        setFb(fb, LANG==='th'?'✗ อันนี้ไม่ใช่องค์ประกอบของชะฮาดะฮ์':'✗ Not a component of the Shahada', false);
      }
    };
    row.appendChild(b);
  });
}

document.getElementById('salahCheck').addEventListener('click',()=>{
  let ok=0, blank=0;
  SALAH.forEach((s,i)=>{
    const el=document.getElementById('rk'+i); if(!el) return;
    const v=el.value.trim();
    if(!v){ blank++; el.style.borderColor=''; return; }
    if(+v===s.r){ ok++; el.style.borderColor='#16a34a'; } else { el.style.borderColor='#dc2626'; }
  });
  const fb=document.getElementById('salahFb');
  if(blank) setFb(fb, LANG==='th'?'กรอกให้ครบทั้ง 5 ช่องก่อน':'Fill in all five boxes first', false);
  else if(ok===5) setFb(fb, LANG==='th'?'✓ ถูกหมด — 2 4 4 3 4 รวม 17 ร็อกอะฮ์':'✓ All correct — 2 4 4 3 4, seventeen in total', true);
  else setFb(fb, (LANG==='th'?'ถูก ':'Correct ')+ok+'/5', false);
});

function calcZakat(){
  const gp=+document.getElementById('goldPrice').value;
  const w=+document.getElementById('wealth').value;
  document.getElementById('gpVal').textContent=gp.toLocaleString();
  document.getElementById('wVal').textContent=w.toLocaleString();
  const nisab=85*gp;
  const out=document.getElementById('zakOut'), fb=document.getElementById('zakFb');
  out.textContent=(LANG==='th'?'พิกัด = ':'Nisab = ')+nisab.toLocaleString()+(LANG==='th'?' บาท':' THB');
  if(w>=nisab){
    const z=Math.round(w*0.025);
    setFb(fb,(LANG==='th'?'ถึงพิกัดแล้ว ต้องจ่ายซะกาต 2.5% = ':'Nisab reached — Zakat due at 2.5% = ')+z.toLocaleString()+(LANG==='th'?' บาท':' THB'),true);
  } else {
    setFb(fb,(LANG==='th'?'ยังไม่ถึงพิกัด ไม่ต้องจ่ายซะกาตมาล (ขาดอีก ':'Below nisab — no Zakat al-Maal due (short by ')
      +(nisab-w).toLocaleString()+(LANG==='th'?' บาท)':' THB)'),false);
  }
}
['goldPrice','wealth'].forEach(id=>document.getElementById(id).addEventListener('input',calcZakat));

let fastPicked=new Set();
function renderFast(){
  const row=document.getElementById('fastRow'); row.innerHTML='';
  document.getElementById('fastFb').textContent='';
  FASTITEMS.forEach((f,i)=>{
    const b=chipBtn(LANG==='th'? f.th : f.en);
    const mark=()=>{ const on=fastPicked.has(i);
      b.style.fontWeight = on?'700':'';
      b.style.outline    = on?'2px solid currentColor':'';
      b.textContent = (on?'✓ ':'') + (LANG==='th'? f.th : f.en); };
    mark();
    b.onclick=()=>{
      if(fastPicked.has(i)) fastPicked.delete(i); else fastPicked.add(i);
      b.classList.remove('green','red'); mark();
    };
    row.appendChild(b);
  });
}
document.getElementById('fastCheck').addEventListener('click',()=>{
  let miss=0, wrong=0;
  const btns=[...document.querySelectorAll('#fastRow button')];
  FASTITEMS.forEach((f,i)=>{
    if(f.ok && !fastPicked.has(i)) miss++;
    if(!f.ok && fastPicked.has(i)) wrong++;
    /* ระบายสีหลังตรวจเท่านั้น เขียว=ตอบถูก แดง=ตอบผิด */
    const b=btns[i]; if(!b) return;
    b.classList.remove('green','red');
    if(fastPicked.has(i)) b.classList.add(f.ok?'green':'red');
    else if(f.ok) b.classList.add('red');
  });
  const fb=document.getElementById('fastFb');

let qi=0, qScore=0, qDone=false;
function renderQuiz(){
  const q=QUIZ[qi];
  document.getElementById('qProgress').textContent =
    (LANG==='th'?'ข้อ ':'Question ')+(qi+1)+'/'+QUIZ.length+
    (LANG==='th'?' · ถูก ':' · score ')+qScore;
  document.getElementById('qText').textContent=T(q.q);
  document.getElementById('qFb').textContent='';
  document.getElementById('qFb').className='fb';
  document.getElementById('qWhy').classList.remove('show');
  document.getElementById('qWhy').innerHTML='<div class="st">'+T(q.w)+'</div>';
  document.getElementById('qHintBox').style.display='none';
  document.getElementById('qHintBox').textContent=T(q.h);
  const cw=document.getElementById('qChoices'); cw.innerHTML='';
  qDone=false;
  q.c.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='btn ghost'; b.style.margin='4px 0'; b.style.textAlign='left';
    b.textContent=T(c);
    b.onclick=()=>{
      if(qDone) return; qDone=true;
      const fb=document.getElementById('qFb');
      if(i===q.a){ b.classList.add('green'); qScore++; setFb(fb, LANG==='th'?'✓ ถูกต้อง':'✓ Correct', true); }
      else { b.classList.add('red'); setFb(fb, (LANG==='th'?'✗ คำตอบคือ ':'✗ The answer is ')+T(q.c[q.a]), false); }
      document.getElementById('qWhy').classList.add('show');
      setTimeout(()=>{ qi=(qi+1)%QUIZ.length; renderQuiz(); }, 3200);
    };
    cw.appendChild(b);
  });
}

  rvwDone=false;

function answerRvw(isRukun){
  if(rvwDone) return; rvwDone=true;
  const q=RVW[rvwI], fb=document.getElementById('hRvwFb');
  const right = (isRukun===(q.r===1));
  if(right) rvwScore++;
  fb.textContent = (right?(LANG==='th'?'✓ ถูก — ':'✓ Correct — ')
                        :(LANG==='th'?'✗ ยังไม่ใช่ — ':'✗ Not quite — ')) + T(q.w);
  fb.className='fb '+(right?'ok':'bad');

}

/* ---- แท็บ 6 ศัพท์อาหรับ ---- */
function renderGloss(){
  const cw=document.getElementById('gCats'); cw.innerHTML='';
  GCATS.forEach(c=>{
    const b=chipBtn(LANG==='th'?c.th:c.en);
    if(c.k===gCat) b.classList.remove('ghost');
    b.onclick=()=>{ gCat=c.k; renderGloss(); };
    cw.appendChild(b);
  });
  const q=(document.getElementById('gSearch').value||'').trim().toLowerCase();
  const rows=GLOSS.filter(g=>{
    if(gCat!=='all' && g.c!==gCat) return false;
    if(!q) return true;
    return (g.ro+' '+g.th+' '+g.en+' '+g.ar).toLowerCase().includes(q);
  });
  const tb=document.getElementById('gBody'); tb.innerHTML='';
  rows.forEach(g=>{
    const tr=document.createElement('tr');
    const a=document.createElement('td');
    a.style.fontSize='1.25em'; a.dir='rtl'; a.textContent=g.ar;
    const r=document.createElement('td'); r.innerHTML='<b></b>';
    r.firstChild.textContent=g.ro;
    const m=document.createElement('td'); m.textContent = LANG==='th'? g.th : g.en;
    tr.append(a,r,m); tb.appendChild(tr);
  });
  document.getElementById('gCount').textContent =
    (LANG==='th'?'แสดง ':'Showing ')+rows.length+(LANG==='th'?' คำ จากทั้งหมด ':' of ')+GLOSS.length;
}

const st=el('style'); st.id='kitui-style'; st.textContent=CSS; D.head.appendChild(st);

/* -----------------------------------------------------------------------------
   1.5) ซ่อมโหมดมืดให้ widget รุ่นเก่า
   widget หลายไฟล์เขียนสีพื้นตายตัวไว้ (background:#fff, #ecfdf5, #fef2f2 ฯลฯ)
   พอสลับเป็นโหมดมืด ตัวหนังสือจะกลายเป็นสีอ่อนบนพื้นอ่อน = อ่านไม่ออก
   แก้แบบทั่วไป: ไล่อ่านทุกกฎ CSS ในหน้า หากพื้นหลัง "สว่างมาก" ให้สร้างกฎทับ
   เฉพาะตอนโหมดมืด โดยคงเฉดสีเดิมไว้แต่ทำให้เข้ม (ไม่ต้องไปแก้ทีละไฟล์)
----------------------------------------------------------------------------- */
/* สีพาสเทลสว่าง -> สีเข้มที่ยังคง "เฉดเดิม" ไว้ (เขียว=ถูก / แดง=ผิด ต้องยังแยกออก)
   ทำผ่าน HSL: คง H, ดัน S ขึ้นให้ยังเห็นสี, กด L ลงให้เข้ม */
function darken(cr,cg,cb){
  const r=cr/255,g=cg/255,b=cb/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  let h=0; if(d){ h = mx===r ? ((g-b)/d+(g<b?6:0)) : mx===g ? ((b-r)/d+2) : ((r-g)/d+4); h*=60; }
  /* ⚠️ ห้ามใช้ saturation ของ HSL ตรง ๆ ตัดสิน: ที่ความสว่างเกือบ 1 ตัวหารจะเล็กมาก
     ทำให้สีที่แทบเป็นสีขาว (เช่น #fdf8f4) ได้ค่าอิ่มสีสูงลิ่ว แล้วกลายเป็นสีน้ำตาลจัดตอนกดให้เข้ม
     ให้ดูจาก "ช่วงห่างของแม่สี" (chroma) แทน แล้วแปลงเป็นความอิ่มสีแบบไล่ระดับ */
  const s = Math.min(.45, Math.max(.08, d*4));
  const l = d<.02 ? .13 : .17;                       /* เทา/ขาวล้วนให้เข้มกว่าสีนิดหน่อย */
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m2=l-c/2;
  let rr,gg,bb;
  if(h<60){rr=c;gg=x;bb=0}else if(h<120){rr=x;gg=c;bb=0}else if(h<180){rr=0;gg=c;bb=x}
  else if(h<240){rr=0;gg=x;bb=c}else if(h<300){rr=x;gg=0;bb=c}else{rr=c;gg=0;bb=x}
  return 'rgb('+Math.round((rr+m2)*255)+','+Math.round((gg+m2)*255)+','+Math.round((bb+m2)*255)+')';
}
function darkFix(){
  const out=[], seen=new Set();
  const take=r=>{
    if(!r.style || !r.selectorText) return;
    if(r.selectorText.indexOf('kitui')>-1) return;               /* ของเราเองใช้ token อยู่แล้ว */
    const bg=r.style.backgroundColor;
    if(!bg || bg.indexOf('var(')>-1) return;
    const m=bg.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?/);
    if(!m) return;
    if(m[4]!==undefined && +m[4]<0.6) return;                    /* โปร่งใสอยู่แล้ว ปล่อยไว้ */
    const cr=+m[1], cg=+m[2], cb=+m[3];
    if((0.2126*cr+0.7152*cg+0.0722*cb)/255 < 0.82) return;       /* ไม่สว่างพอ ไม่ต้องยุ่ง */
    const key=r.selectorText+'|'+bg; if(seen.has(key)) return; seen.add(key);
    const repl = (cr>250&&cg>250&&cb>250) ? 'var(--card)' : darken(cr,cg,cb);
    let css='background-color:'+repl;
    /* ถ้ากฎนั้นกำหนดสีตัวอักษรเข้มไว้ด้วย ต้องพลิกเป็นสีอ่อน ไม่งั้นดำบนดำ */
    const fg=r.style.color, fm=fg&&fg.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    if(fm && (0.2126*+fm[1]+0.7152*+fm[2]+0.0722*+fm[3])/255 < 0.5) css+=';color:var(--ink)';
    out.push(':root[data-theme="dark"] '+r.selectorText+'{'+css+'}');
  };
  /* ⚠️ กฎธรรมดาก็มี .cssRules เป็น list "ว่าง" ได้ (รองรับ CSS nesting)
        ห้ามใช้ if(r.cssRules) แล้ว continue ไม่งั้นข้ามทุกกฎ */
  const visit=rules=>{
    for(let i=0;i<rules.length;i++){
      const r=rules[i];
      if(r.selectorText) take(r);
      if(r.cssRules && r.cssRules.length) visit(r.cssRules);     /* @media / @supports / nesting */
    }
  };
  for(let i=0;i<D.styleSheets.length;i++){
    let rr; try{ rr=D.styleSheets[i].cssRules; }catch(e){ continue; }   /* ข้ามชีตข้ามโดเมน */
    if(rr) visit(rr);
  }
  if(out.length){ const s=el('style'); s.id='kitui-darkfix'; s.textContent=out.join('\n'); D.head.appendChild(s); }
  return out.length;
}
try{ window.__KITUI_DARKFIX__ = (D.body.getAttribute('data-kit-theme')==='off') ? 'locked' : darkFix(); }
catch(e){ window.__KITUI_DARKFIX__='err:'+e.message; }

/* darkFix ข้างบนซ่อมได้เฉพาะสีที่เขียนตายตัวในไฟล์ CSS
   แต่ยังมีอีกกรณี: widget ใช้ตัวแปรธีมเป็น "พื้นหลัง" เช่น background:var(--accent-head)
   ซึ่งในโหมดมืดตัวแปรนั้นกลายเป็นสีอ่อน (เพราะปกติใช้เป็นสีหัวข้อ) -> อ่อนบนอ่อน
   จับกรณีนี้ตอนรันจริง: ถ้าพื้นหลัง "สว่าง" และตัวหนังสือก็ "สว่าง" = อ่านไม่ออกแน่นอน ให้กดพื้นให้เข้ม */
const rgbOf=c=>{const m=c&&c.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?/);return m?[+m[1],+m[2],+m[3],m[4]===undefined?1:+m[4]]:null;};
const lumOf=v=>v?(0.2126*v[0]+0.7152*v[1]+0.0722*v[2])/255:null;
/* ตรงข้ามกับ darken(): ดึงสีตัวอักษรเข้ม ๆ ให้สว่างขึ้นแต่คงเฉดเดิม
   (เช่น สูตรสีน้ำเงินเข้ม -> ฟ้าอ่อน ไม่ใช่กลายเป็นขาวหมดจนแยกไม่ออก) */
function lighten(cr,cg,cb){
  const r=cr/255,g=cg/255,b=cb/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  if(d<0.04) return 'var(--ink)';                    /* เทา/ดำล้วน -> ใช้สีตัวอักษรของธีม */
  let h = mx===r ? ((g-b)/d+(g<b?6:0)) : mx===g ? ((b-r)/d+2) : ((r-g)/d+4); h*=60;
  const l0=(mx+mn)/2, s0=d/(1-Math.abs(2*l0-1));
  const s=Math.min(.92,Math.max(.55,s0)), l=.72;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m2=l-c/2;
  let rr,gg,bb;
  if(h<60){rr=c;gg=x;bb=0}else if(h<120){rr=x;gg=c;bb=0}else if(h<180){rr=0;gg=c;bb=x}
  else if(h<240){rr=0;gg=x;bb=c}else if(h<300){rr=x;gg=0;bb=c}else{rr=c;gg=0;bb=x}
  return 'rgb('+Math.round((rr+m2)*255)+','+Math.round((gg+m2)*255)+','+Math.round((bb+m2)*255)+')';
}
const SKIP={CANVAS:1,IMG:1,VIDEO:1,SVG:1,IFRAME:1,PICTURE:1,OBJECT:1};
const OBS_OPT={childList:true,subtree:true,attributes:true,attributeFilter:['class','style']};
let patched=[], obs=null;
function elementFix(){
  /* ⚠️ ตัวเราเองแก้ inline style => MutationObserver จะเด้งกลับมาเรียกซ้ำไม่รู้จบ (กินแบตมือถือ)
        ต้องปลดการเฝ้าดูระหว่างทำงาน แล้วค่อยต่อกลับ */
  if(obs) obs.disconnect();
  try{ elementFixCore(); } finally { if(obs) obs.observe(D.body,OBS_OPT); }
}
function elementFixCore(){
  if(D.body.getAttribute('data-kit-theme')==='off') return;   /* หน้าที่ล็อกธีมไว้ ห้ามไปยุ่งสี */
  /* ⚠️ ห้ามลบสีเดิมทิ้งทุกครั้งที่สแกน! หน้าที่มี transition จะเริ่มไล่สีใหม่ทุกๆ รอบ = กะพริบไม่หยุด
     ตอนอยู่โหมดมืดให้ "ทาเฉพาะตัวที่ยังสว่าง" เท่านั้น ตัวที่ทาไปแล้วจะคำนวณได้ค่าเข้ม -> ถูกข้ามเอง
     จะลบสีที่เราทาไว้ ก็ต่อเมื่อสลับกลับเป็นโหมดสว่างเท่านั้น */
  if(R.getAttribute('data-theme')!=='dark'){
    patched.forEach(e=>{ e.style.removeProperty('background-color'); e.style.removeProperty('color'); });
    patched=[];
    return;
  }
  /* ไล่ทั้งหน้า: อะไรที่พื้นยัง "สว่าง" อยู่ในโหมดมืด ให้กดให้เข้ม (คงเฉดสีเดิม)
     ครอบคลุมทั้งกรณีสีเขียนตายตัว, สีจากตัวแปรธีม, และไฟล์ CSS แยกที่อ่านกฎไม่ได้ */
  /* ต้องรวม html/body ด้วย บาง widget ตั้งพื้นหลังหน้าไว้ที่สองตัวนี้ (querySelectorAll ไม่นับ) */
  const all=[R, D.body].concat([].slice.call(D.body.querySelectorAll('*')));
  for(let i=0;i<all.length;i++){
    const e=all[i];
    if(e.id&&e.id.indexOf('kitui')===0) continue;
    if(e.closest&&(e.closest('#kitui-bar')||e.closest('.kitui-sheet'))) continue;
    if(SKIP[e.tagName]) continue;                      /* พื้นที่วาดภาพ/สื่อ อย่าไปยุ่ง */
    const s=getComputedStyle(e);
    const bg=rgbOf(s.backgroundColor);
    if(!bg || bg[3]<0.6) continue;                     /* โปร่งใส = เห็นพื้นข้างหลังอยู่แล้ว */
    if(lumOf(bg)<0.72) continue;                       /* เข้มพออยู่แล้ว */
    /* ต้องใส่ important เพราะบาง widget ประกาศ background ... !important ไว้ ซึ่งชนะ inline ธรรมดา */
    e.style.setProperty('background-color', darken(bg[0],bg[1],bg[2]), 'important');
    const fg=rgbOf(s.color);
    if(fg && lumOf(fg)<0.5) e.style.setProperty('color','var(--ink)','important');  /* ตัวหนังสือเข้ม -> พลิกเป็นอ่อน */
    patched.push(e);
  }
  /* รอบสอง: ตัวอักษรสีเข้มที่ "ตกอยู่บนพื้นเข้ม" (พื้นมาจาก element แม่ที่เพิ่งถูกกดให้มืด)
     ถ้าไม่พลิกด้วย จะกลายเป็นเข้มบนเข้ม อ่านไม่ออก — คงเฉดสีเดิมไว้ให้ยังแยกความหมายได้ */
  const bgCache=new Map();
  const effBg=n=>{
    for(let p=n;p;p=p.parentElement){
      if(bgCache.has(p)) return bgCache.get(p);
      const b=rgbOf(getComputedStyle(p).backgroundColor);
      if(b && b[3]>0.5){ bgCache.set(n,b); return b; }
    }
    return null;
  };
  for(let i=2;i<all.length;i++){
    const e=all[i];
    if(SKIP[e.tagName] || (e.id&&e.id.indexOf('kitui')===0)) continue;
    if(e.closest&&(e.closest('#kitui-bar')||e.closest('.kitui-sheet'))) continue;
    if(e.style.color) continue;                         /* จัดการไปแล้วในรอบแรก */
    if(!e.textContent || !e.textContent.trim()) continue;
    const fg=rgbOf(getComputedStyle(e).color);
    if(!fg || lumOf(fg)>=0.45) continue;                 /* ตัวอักษรสว่างอยู่แล้ว */
    const bg=effBg(e);
    if(!bg || lumOf(bg)>=0.5) continue;                  /* พื้นยังสว่าง อ่านออกอยู่ */
    e.style.setProperty('color', lighten(fg[0],fg[1],fg[2]), 'important');
    patched.push(e);
  }
}
let efT=0;
const scheduleFix=()=>{ clearTimeout(efT); efT=setTimeout(elementFix,220); };
try{
  obs=new MutationObserver(scheduleFix);
  obs.observe(D.body,OBS_OPT);
}catch(e){}

/* =============================================================================
   2) ธีม + ขนาดตัวอักษร
   ============================================================================= */
const FS=[.85,1,1.15,1.3,1.5], FSNAME=['เล็กสุด','เล็ก','ปกติ','ใหญ่','ใหญ่สุด'];
let fsIdx=parseInt(get('fs')); if(isNaN(fsIdx)||fsIdx<0||fsIdx>4) fsIdx=1;
let theme=get('theme') || (matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');

/* หน้าที่ออกแบบธีมมาเองครบแล้ว (เช่น "หนังสือทบทวน" พื้นเข้มทั้งเล่ม) ให้ปิดระบบธีมของ KIT UI
   ไม่งั้นโทเคน --bg/--ink ของเราจะไปทับสีที่หน้านั้นตั้งไว้ แล้วหน้าเพี้ยน
   ใส่ที่ tag body:  data-kit-theme="off"   (ปุ่มปรับขนาดตัวอักษรยังใช้ได้ตามปกติ) */
const themeLock = D.body.getAttribute('data-kit-theme')==='off';

function applyTheme(){
  if(themeLock) return;
  R.setAttribute('data-theme',theme);
  R.style.colorScheme = theme==='dark'?'dark':'light';   /* ให้ select/input เป็นสีเข้มด้วย */
  const b=D.getElementById('kitui-theme'); if(b){b.textContent=theme==='dark'?'☀️':'🌙';b.title=theme==='dark'?'สลับเป็นโหมดสว่าง':'สลับเป็นโหมดมืด';}
  set('theme',theme);
  clearTimeout(efT);                                   /* ยกเลิกคิวเก่าที่ค้างจากธีมก่อนหน้า */
  if(typeof elementFix==='function') elementFix();
  /* ⚠️ ห้ามอ้างถึงตัวแปรของส่วน "ที่ทด" ตรงนี้!
     applyTheme() ถูกเรียกก่อนที่ `let pad` ในส่วนที่ 4 จะทำงาน → ชน temporal dead zone
     แล้ว ReferenceError จะทำให้สคริปต์ตายทั้งก้อน (ปุ่มขนาดอักษร/ที่ทด/เครื่องคิดเลขหายหมด)
     ใช้วิธียิง event แทน ใครสนใจค่อยไปดักฟังเอง */
  try{ D.dispatchEvent(new CustomEvent('kitui-theme')); }catch(e){}
}
function applyFS(){
  R.style.fontSize=(16*FS[fsIdx])+'px';
  const l=D.getElementById('kitui-fslabel'); if(l)l.textContent=FSNAME[fsIdx];
  set('fs',fsIdx);
}

/* =============================================================================
   3) แถบเครื่องมือ
   ============================================================================= */
const subj=(D.body.getAttribute('data-subject')||'').toLowerCase();
/* หลาย widget ไม่ได้ใส่ data-subject ที่ <body> → เดาจากโฟลเดอร์ที่ไฟล์อยู่ด้วย */
const inPath=/\/(physics|math|chemist)\//i.test(decodeURIComponent(location.pathname));
const tAttr=D.body.getAttribute('data-tools');
const wantTools = tAttr!=null ? tAttr.toLowerCase()
                : ((['math','physics','chem'].includes(subj) || inPath) ? 'pen,calc' : '');
const hasPen  = wantTools.includes('pen');
const hasCalc = wantTools.includes('calc');

/* ปุ่มกลับหน้าหลัก — โผล่เฉพาะตอนเปิดจากเว็บห้องติว (พาธมี /app/ อยู่)
   เปิดไฟล์จากเครื่องตรง ๆ จะไม่มีปุ่มนี้ เพราะไม่มีหน้าหลักให้กลับ ลิงก์จะเสียเปล่า ๆ */
const homeHref = (()=>{
  const attr = D.body.getAttribute('data-home');     /* หน้าไหนไม่ได้อยู่ใต้ /app/ ให้ระบุเองได้ */
  if(attr) return attr;
  try{
    const p = decodeURIComponent(location.pathname);
    const i = p.indexOf('/app/');
    return i < 0 ? null : p.slice(0, i+1) + 'index.html';
  }catch(e){ return null; }
})();

const bar=el('div'); bar.id='kitui-bar';
bar.innerHTML =
  `<button id="kitui-grip" title="ย่อ/ขยายแถบเครื่องมือ">⚙️</button>`+
  (homeHref ? `<button id="kitui-home" title="กลับหน้าหลัก">🏠</button><span class="kitui-sep"></span>` : '')+
  (themeLock ? '' : `<button id="kitui-theme" title="สลับโหมดมืด/สว่าง">🌙</button><span class="kitui-sep"></span>`)+
  `<button id="kitui-fsdown" title="ตัวหนังสือเล็กลง">A−</button>`+
  `<span class="kitui-fs" id="kitui-fslabel">ปกติ</span>`+
  `<button id="kitui-fsup" title="ตัวหนังสือใหญ่ขึ้น">A+</button>`+
  (hasPen ? `<span class="kitui-sep"></span><button id="kitui-penbtn" title="ที่ทด (เขียนด้วยปากกา)">✏️</button>`:'')+
  (hasCalc? `<button id="kitui-calcbtn" title="เครื่องคิดเลขวิทยาศาสตร์">🧮</button>`:'');
D.body.appendChild(bar);

if(!themeLock) D.getElementById('kitui-theme').onclick=()=>{theme=theme==='dark'?'light':'dark';applyTheme();};
D.getElementById('kitui-fsup').onclick=()=>{if(fsIdx<4){fsIdx++;applyFS();}};
D.getElementById('kitui-fsdown').onclick=()=>{if(fsIdx>0){fsIdx--;applyFS();}};
D.getElementById('kitui-grip').onclick=()=>bar.classList.toggle('hidden');
if(homeHref) D.getElementById('kitui-home').onclick=()=>{ location.href=homeHref; };

/* ปุ่มกลับแบบลอยมุมซ้ายบน — มีคำว่า "กลับ" เต็ม ๆ ไม่ใช่ไอคอนเปล่า
   (ของเดิมเป็น 🏠 เล็ก ๆ ปนอยู่ในแถบมุมขวาล่าง เพื่อนหาไม่เจอเลยไม่กด) */
if(homeHref){
  const back=el('button'); back.id='kitui-back';
  back.type='button'; back.title='กลับหน้ารวมวิชา';
  back.innerHTML='<span class="ar">←</span><span>กลับ</span>';
  back.onclick=()=>{ location.href=homeHref; };
  const nav=el('div'); nav.id='kitui-nav';
  nav.appendChild(back);

  /* ปุ่มถาม AI — เจ้าของทักว่าไม่มีใครย้อนกลับไปหน้ารวมเพื่อกดถาม ต้องถามจากหน้าที่เรียนอยู่ได้เลย
     ส่งวิชาของหน้านี้ไปด้วย (?s=) หน้าถามจะได้เลือกวิชาให้เอง ไม่ต้องมากดซ้ำ */
  const onAsk = /(^|\/)ask\.html$/.test(location.pathname);
  if(!onAsk){
    const subj = D.body.getAttribute('data-subject') || '';
    const a=el('a'); a.id='kitui-ask';
    /* ส่งหน้าปัจจุบันไปด้วย หน้าถามจะได้ทำปุ่มกลับให้ย้อนมาที่หน้านี้ ไม่ใช่เด้งไปหน้ารวม */
    const q=[];
    if(subj) q.push('s='+encodeURIComponent(subj));
    q.push('from='+encodeURIComponent(location.pathname));
    a.href = homeHref.replace(/index\.html$/,'ask.html') + '?' + q.join('&');
    a.title='ถาม AI เรื่องที่กำลังอ่านอยู่';
    a.innerHTML='<span class="ar">🔎</span><span>ถาม AI</span>';
    nav.appendChild(a);
  }
  D.body.appendChild(nav);
  D.body.classList.add('kitui-hasback');

  /* ปุ่ม 💬 ส่งความเห็น — เก็บโค้ดไว้ที่ site/feedback.js ไฟล์เดียว ไม่ฝังซ้ำใน 200 กว่าไฟล์
     homeHref ลงท้ายด้วย index.html เสมอ (ยาว 10 ตัว) ตัดออกแล้วต่อชื่อไฟล์ใหม่ */
  const rootURL = homeHref.slice(0, homeHref.length-10);
  ['feedback.js','tour.js'].forEach(function(n){
    const s=el('script'); s.src=rootURL+n; s.defer=true; D.body.appendChild(s);
  });
}
applyTheme(); applyFS();

/* ปิดแผงด้วยปุ่ม Esc */
D.addEventListener('keydown',e=>{ if(e.key==='Escape') D.querySelectorAll('.kitui-sheet.open').forEach(s=>s.classList.remove('open')); });

/* ลากหัวแผงเพื่อปรับความสูง */
function makeResizable(sheet){
  const head=sheet.querySelector('.kitui-head'); let y0=0,h0=0,drag=false;
  head.addEventListener('pointerdown',e=>{
    if(e.target.closest('button'))return;
    drag=true;y0=e.clientY;h0=sheet.getBoundingClientRect().height;head.setPointerCapture(e.pointerId);
  });
  head.addEventListener('pointermove',e=>{
    if(!drag)return;
    const h=Math.min(innerHeight*.95,Math.max(180,h0+(y0-e.clientY)));
    sheet.classList.remove('full'); sheet.style.height=h+'px';
    if(sheet.id==='kitui-pad') fitPad();
  });
  head.addEventListener('pointerup',e=>{drag=false;try{head.releasePointerCapture(e.pointerId)}catch(x){}});
}

/* =============================================================================
   4) ที่ทด — ปากกา / ปากกาเน้น / ยางลบ  หลายหน้า  เซฟอัตโนมัติ
   ============================================================================= */
let pad,padCv,padCx,pages=[[]],pg=0,undone=[],histo=[];
let tool='pen',color='#111827',width=2.4,penSeen=0;
const COLORS=['#111827','#2563eb','#dc2626','#16a34a','#f59e0b'];
const PADKEY='pad-'+location.pathname.split('/').pop();

function buildPad(){
  pad=el('div','kitui-sheet'); pad.id='kitui-pad';
  pad.innerHTML=
   `<div class="kitui-head">
      <b>✏️ ที่ทด</b>
      <button data-t="pen" class="on">🖊️</button>
      <button data-t="hl">🖍️</button>
      <button data-t="er">🧽</button>
      ${COLORS.map((c,i)=>`<button class="kitui-sw${i===0?' on':''}" data-c="${c}" style="background:${c}"></button>`).join('')}
      <button data-w="1.2">เส้นบาง</button><button data-w="2.4" class="on">กลาง</button><button data-w="4.5">หนา</button>
      <span class="kitui-spacer"></span>
      <button id="kitui-undo">↶</button><button id="kitui-redo">↷</button>
      <button id="kitui-pgprev">‹</button><span id="kitui-pgnum" style="font-size:.82rem;font-weight:700">1/1</span><button id="kitui-pgnext">›</button>
      <button id="kitui-pgadd">+ หน้า</button>
      <button id="kitui-clear">ล้างหน้านี้</button>
      <button id="kitui-full">⛶</button>
      <button id="kitui-padclose">✕</button>
    </div>
    <div class="kitui-padwrap"><canvas></canvas></div>`;
  D.body.appendChild(pad);
  padCv=pad.querySelector('canvas'); padCx=padCv.getContext('2d');
  makeResizable(pad);

  pad.querySelector('.kitui-head').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return;
    if(b.dataset.t){tool=b.dataset.t;pad.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));}
    if(b.dataset.c){color=b.dataset.c;pad.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));}
    if(b.dataset.w){width=+b.dataset.w;pad.querySelectorAll('[data-w]').forEach(x=>x.classList.toggle('on',x===b));}
  });
  D.getElementById('kitui-undo').onclick=()=>{ if(histo.length){ undone.push(pages[pg]); pages[pg]=histo.pop(); draw(); save(); } };
  D.getElementById('kitui-redo').onclick=()=>{ if(undone.length){ histo.push(pages[pg]); pages[pg]=undone.pop(); draw(); save(); } };
  D.getElementById('kitui-clear').onclick=()=>{ snap(); pages[pg]=[]; draw(); save(); };
  D.getElementById('kitui-pgadd').onclick=()=>{ pages.splice(pg+1,0,[]); pg++; histo=[];undone=[]; draw(); save(); };
  D.getElementById('kitui-pgprev').onclick=()=>{ if(pg>0){pg--;histo=[];undone=[];draw();} };
  D.getElementById('kitui-pgnext').onclick=()=>{ if(pg<pages.length-1){pg++;histo=[];undone=[];draw();} };
  D.getElementById('kitui-full').onclick=()=>{ pad.classList.toggle('full'); pad.style.height=''; fitPad(); };
  D.getElementById('kitui-padclose').onclick=()=>pad.classList.remove('open');

  /* ---- วาด ---- */
  let cur=null;
  padCv.addEventListener('pointerdown',e=>{
    if(e.pointerType==='pen') penSeen=Date.now();
    if(e.pointerType==='touch' && Date.now()-penSeen<1500) return;   /* กันฝ่ามือแตะตอนใช้สไตลัส */
    const p=pt(e);
    if(tool==='er'){ snap(); erase(p); return; }
    snap();
    cur={c:color,w:width,hl:tool==='hl',pts:[p]};
    pages[pg].push(cur); draw();
    try{ padCv.setPointerCapture(e.pointerId); }catch(x){}  /* บางเบราว์เซอร์/ปากกาโยน error ตรงนี้ ห้ามให้ล้มทั้งเส้น */
  });
  padCv.addEventListener('pointermove',e=>{
    if(e.pointerType==='touch' && Date.now()-penSeen<1500) return;
    if(tool==='er'&&e.buttons){ erase(pt(e)); return; }
    if(!cur||!e.buttons)return;
    /* getCoalescedEvents ให้ลายลื่นขึ้นตอนลากเร็ว แต่บางกรณีคืนอาร์เรย์ว่าง → ต้อง fallback ไม่งั้นเส้นหาย */
    let evs=[e];
    if(e.getCoalescedEvents){ const c=e.getCoalescedEvents(); if(c&&c.length) evs=c; }
    evs.forEach(ev=>cur.pts.push(pt(ev)));
    draw();
  });
  const end=()=>{ if(cur){cur=null;save();} };
  padCv.addEventListener('pointerup',end); padCv.addEventListener('pointercancel',end);
  padCv.addEventListener('pointerleave',end);

  addEventListener('resize',()=>{ if(pad.classList.contains('open')) fitPad(); });
  D.addEventListener('kitui-theme',()=>draw());   /* สลับธีมแล้ววาดลายใหม่ เส้นดำ<->ขาวตามพื้น */
  load(); fitPad();
}
function pt(e){
  const r=padCv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height,
          p:(e.pointerType==='pen'&&e.pressure>0)?e.pressure:0.5};   /* เก็บเป็นสัดส่วน 0-1 → resize แล้วลายไม่เพี้ยน */
}
function snap(){ histo.push(pages[pg].slice()); if(histo.length>60)histo.shift(); undone=[]; }
function erase(p){
  const r=padCv.getBoundingClientRect(), rad=18/r.width;
  const keep=pages[pg].filter(s=>!s.pts.some(q=>Math.hypot(q.x-p.x,(q.y-p.y)*(r.height/r.width))<rad));
  if(keep.length!==pages[pg].length){ pages[pg]=keep; draw(); save(); }
}
function fitPad(){
  const w=pad.querySelector('.kitui-padwrap').clientWidth, h=pad.querySelector('.kitui-padwrap').clientHeight;
  const dpr=Math.min(devicePixelRatio||1,2.5);
  padCv.width=Math.max(1,w*dpr); padCv.height=Math.max(1,h*dpr);
  draw();
}
function draw(){
  const W=padCv.width,H=padCv.height,dpr=Math.min(devicePixelRatio||1,2.5);
  padCx.clearRect(0,0,W,H);
  /* เส้นตารางจาง ๆ ให้เขียนตรง */
  const dark=R.getAttribute('data-theme')==='dark';
  padCx.strokeStyle=dark?'rgba(148,163,184,.14)':'rgba(100,116,139,.13)'; padCx.lineWidth=1;
  for(let y=28*dpr;y<H;y+=28*dpr){padCx.beginPath();padCx.moveTo(0,y);padCx.lineTo(W,y);padCx.stroke();}
  padCx.lineCap='round'; padCx.lineJoin='round';
  pages[pg].forEach(s=>{
    padCx.globalAlpha=s.hl?0.32:1;
    padCx.strokeStyle=(dark&&s.c==='#111827')?'#e5e9f0':s.c;
    for(let i=1;i<s.pts.length;i++){
      const a=s.pts[i-1],b=s.pts[i];
      padCx.lineWidth=(s.hl?s.w*4:s.w*(0.55+b.p))*dpr;
      padCx.beginPath(); padCx.moveTo(a.x*W,a.y*H); padCx.lineTo(b.x*W,b.y*H); padCx.stroke();
    }
    if(s.pts.length===1){ /* จุดเดียว */
      padCx.fillStyle=padCx.strokeStyle; padCx.beginPath();
      padCx.arc(s.pts[0].x*W,s.pts[0].y*H,(s.hl?s.w*2:s.w)*dpr,0,7); padCx.fill();
    }
  });
  padCx.globalAlpha=1;
  const n=D.getElementById('kitui-pgnum'); if(n)n.textContent=(pg+1)+'/'+pages.length;
}
function save(){ try{ localStorage.setItem('kitui-'+PADKEY, JSON.stringify(pages)); }catch(e){} }
function load(){
  try{ const j=JSON.parse(localStorage.getItem('kitui-'+PADKEY)); if(Array.isArray(j)&&j.length){pages=j;pg=0;} }catch(e){}
}

if(hasPen){
  buildPad();
  D.getElementById('kitui-penbtn').onclick=()=>{
    const o=pad.classList.toggle('open');
    D.getElementById('kitui-penbtn').classList.toggle('on',o);
    if(o) fitPad();
  };
}

/* =============================================================================
   5) เครื่องคิดเลขวิทยาศาสตร์  (tokenizer → shunting-yard → RPN  ไม่ใช้ eval)
   ============================================================================= */
const FN={sin:1,cos:1,tan:1,asin:1,acos:1,atan:1,ln:1,log:1,sqrt:1,abs:1,exp:1};
const PREC={'+':1,'-':1,'*':2,'/':2,'^':4,'u-':3};
function tokenize(s){
  s=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/√/g,'sqrt').replace(/π/g,'PI');
  const out=[]; const re=/(\d+\.?\d*|\.\d+|[A-Za-z]+|\*\*|[+\-*/^%!()])/g; let m;
  while((m=re.exec(s))) out.push(m[1]);
  return out;
}
function toRPN(tk){
  const out=[],op=[]; let prev=null;
  for(let t of tk){
    if(t==='**')t='^';
    if(/^[\d.]+$/.test(t)){ out.push(parseFloat(t)); }
    else if(t==='PI'){ out.push(Math.PI); }
    else if(t==='e'||t==='E'){ out.push(Math.E); }
    else if(t==='ANS'){ out.push(ANS); }
    else if(FN[t]){ op.push(t); }
    else if(t==='('){ op.push(t); }
    else if(t===')'){
      while(op.length&&op[op.length-1]!=='(') out.push(op.pop());
      if(!op.length) throw 0; op.pop();
      if(op.length&&FN[op[op.length-1]]) out.push(op.pop());
    }
    else if(t==='!'||t==='%'){ out.push(t==='!'?'fact':'pct'); }
    else if('+-*/^'.includes(t)){
      let o=t;
      const unary = (prev===null||prev==='('||'+-*/^'.includes(prev));
      if(t==='-'&&unary) o='u-';
      else if(t==='+'&&unary){ prev=t; continue; }
      while(op.length){
        const top=op[op.length-1];
        if(top==='('||FN[top])break;
        const rightAssoc=(o==='^'||o==='u-');
        if(PREC[top]>PREC[o] || (PREC[top]===PREC[o]&&!rightAssoc)) out.push(op.pop()); else break;
      }
      op.push(o);
    }
    else throw 0;
    prev=t;
  }
  while(op.length){ const o=op.pop(); if(o==='(')throw 0; out.push(o); }
  return out;
}
function evalRPN(rpn,deg){
  const st=[], D2R=deg?Math.PI/180:1, R2D=deg?180/Math.PI:1;
  const pop=()=>{ if(!st.length)throw 0; return st.pop(); };
  for(const t of rpn){
    if(typeof t==='number'){ st.push(t); continue; }
    if(t==='fact'){ const n=pop(); if(n<0||n>170||n!==Math.floor(n))throw 0; let r=1; for(let i=2;i<=n;i++)r*=i; st.push(r); continue; }
    if(t==='pct'){ st.push(pop()/100); continue; }
    if(t==='u-'){ st.push(-pop()); continue; }
    if(FN[t]){
      const a=pop();
      st.push( t==='sin'?Math.sin(a*D2R) : t==='cos'?Math.cos(a*D2R) : t==='tan'?Math.tan(a*D2R)
             : t==='asin'?Math.asin(a)*R2D : t==='acos'?Math.acos(a)*R2D : t==='atan'?Math.atan(a)*R2D
             : t==='ln'?Math.log(a) : t==='log'?Math.log10(a) : t==='sqrt'?Math.sqrt(a)
             : t==='abs'?Math.abs(a) : Math.exp(a) );
      continue;
    }
    const b=pop(),a=pop();
    st.push( t==='+'?a+b : t==='-'?a-b : t==='*'?a*b : t==='/'?a/b : Math.pow(a,b) );
  }
  if(st.length!==1) throw 0;
  return st[0];
}
function calc(src,deg){ return evalRPN(toRPN(tokenize(src)),deg); }

let ANS=0, expr='', calcSheet, isDeg=true;
const KEYS=[
 ['DEG','deg','fn'],['(','(',''],[')',')',''],['⌫','del','del'],['AC','ac','del'],
 ['sin','sin(','fn'],['cos','cos(','fn'],['tan','tan(','fn'],['π','π','fn'],['÷','÷','op'],
 ['sin⁻¹','asin(','fn'],['cos⁻¹','acos(','fn'],['tan⁻¹','atan(','fn'],['e','e','fn'],['×','×','op'],
 ['ln','ln(','fn'],['log','log(','fn'],['√','√(','fn'],['xʸ','^','fn'],['−','−','op'],
 ['7','7',''],['8','8',''],['9','9',''],['x!','!','fn'],['+','+','op'],
 ['4','4',''],['5','5',''],['6','6',''],['%','%','fn'],['ANS','ANS','fn'],
 ['1','1',''],['2','2',''],['3','3',''],['.','.',''],['=','eq','eq'],
 ['0','0','w3'],['x²','^2','fn']
];
function buildCalc(){
  calcSheet=el('div','kitui-sheet'); calcSheet.id='kitui-calc';
  calcSheet.innerHTML=
   `<div class="kitui-head"><b>🧮 เครื่องคิดเลขวิทยาศาสตร์</b><span class="kitui-spacer"></span>
      <button id="kitui-calcclose">✕</button></div>
    <div class="kitui-disp"><div class="ex" id="kitui-ex">&nbsp;</div><div class="rs" id="kitui-rs">0</div></div>
    <div class="kitui-keys" id="kitui-keys">
      ${KEYS.map(k=>`<button class="${k[2]}" data-k="${k[1].replace(/"/g,'&quot;')}">${k[0]}</button>`).join('')}
    </div>`;
  D.body.appendChild(calcSheet);
  D.getElementById('kitui-calcclose').onclick=()=>calcSheet.classList.remove('open');
  const ex=D.getElementById('kitui-ex'), rs=D.getElementById('kitui-rs');
  const show=()=>{ ex.textContent=expr||' ';
    try{ rs.textContent = expr? fmt(calc(expr,isDeg)) : '0'; rs.style.opacity=.62; }
    catch(e){ rs.style.opacity=.35; }
  };
  D.getElementById('kitui-keys').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return; const k=b.dataset.k;
    if(k==='ac'){ expr=''; rs.textContent='0'; ex.textContent=' '; return; }
    if(k==='del'){ expr=expr.slice(0,-1); show(); return; }
    if(k==='deg'){ isDeg=!isDeg; b.textContent=isDeg?'DEG':'RAD'; b.classList.toggle('on',!isDeg); show(); return; }
    if(k==='eq'){
      rs.style.opacity=1;
      try{
        const v=calc(expr,isDeg);
        if(Number.isNaN(v)){ rs.textContent='ไม่นิยาม (โดเมนไม่ถูก)'; return; }
        if(!isFinite(v)){ rs.textContent='หารด้วย 0 ไม่ได้'; return; }
        ANS=v; ex.textContent=expr+' ='; rs.textContent=fmt(v); expr=String(v);
      }catch(err){ rs.textContent='รูปแบบไม่ถูกต้อง'; }
      return;
    }
    expr+=k; show();
  });
}
function fmt(v){
  if(!isFinite(v)) return v>0?'∞':(v<0?'-∞':'ไม่นิยาม');
  if(Math.abs(v)>=1e12||(Math.abs(v)<1e-9&&v!==0)) return v.toExponential(8).replace(/e/,'×10^');
  return String(Math.round(v*1e10)/1e10);
}
if(hasCalc){
  buildCalc();
  D.getElementById('kitui-calcbtn').onclick=()=>{
    const o=calcSheet.classList.toggle('open');
    D.getElementById('kitui-calcbtn').classList.toggle('on',o);
  };
}
})();

</script>
