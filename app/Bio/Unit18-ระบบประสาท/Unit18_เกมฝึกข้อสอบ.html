<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกมฝึกข้อสอบ — Unit 18 ระบบประสาท</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020; --bg2:#0f1730; --card:#141d38; --card2:#1a2545;
  --line:#26345c; --txt:#e8edf7; --mut:#94a3c4;
  --teal:#2dd4bf; --purple:#a78bfa; --blue:#60a5fa;
  --green:#34d399; --red:#fb7185; --amber:#fbbf24;
  --glow:0 0 30px rgba(45,212,191,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Sarabun','Noto Sans Thai',system-ui,-apple-system,sans-serif;
  background:radial-gradient(1200px 600px at 50% -10%,#16224a 0%,var(--bg) 55%);
  color:var(--txt); min-height:100%; padding:18px; line-height:1.55;
}
.wrap{max-width:760px;margin:0 auto}
header{text-align:center;margin-bottom:18px}
header h1{font-size:1.5rem;font-weight:700;letter-spacing:.3px;
  background:linear-gradient(90deg,var(--teal),var(--purple));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
header p{color:var(--mut);font-size:.9rem;margin-top:4px}

.card{background:linear-gradient(180deg,var(--card),var(--bg2));
  border:1px solid var(--line);border-radius:20px;padding:22px;
  box-shadow:0 10px 40px rgba(0,0,0,.35)}

/* mode select */
.modes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.mode-btn{padding:14px 8px;border-radius:14px;border:1px solid var(--line);
  background:var(--card2);color:var(--txt);cursor:pointer;font-family:inherit;
  font-size:.95rem;font-weight:600;transition:.18s;text-align:center}
.mode-btn:hover{border-color:var(--teal);transform:translateY(-2px)}
.mode-btn.active{background:linear-gradient(135deg,rgba(45,212,191,.22),rgba(167,139,250,.22));
  border-color:var(--teal);box-shadow:var(--glow)}
.mode-btn small{display:block;color:var(--mut);font-weight:400;font-size:.72rem;margin-top:3px}

/* slider — styled for cross-browser consistency */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:999px;
  background:var(--card2);border:1px solid var(--line);outline:none;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;
  border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--green));
  border:2px solid #06231f;box-shadow:0 0 10px rgba(45,212,191,.55);cursor:pointer;margin-top:-1px}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:2px solid #06231f;border-radius:50%;
  background:var(--teal);box-shadow:0 0 10px rgba(45,212,191,.55);cursor:pointer}
input[type=range]::-moz-range-track{height:8px;border-radius:999px;background:var(--card2)}

.startbtn{width:100%;padding:15px;border:none;border-radius:14px;cursor:pointer;
  font-family:inherit;font-size:1.05rem;font-weight:700;color:#06231f;
  background:linear-gradient(135deg,var(--teal),var(--green));
  box-shadow:var(--glow);transition:.18s}
.startbtn:hover{filter:brightness(1.08);transform:translateY(-2px)}

/* HUD */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin-bottom:14px;font-size:.85rem;color:var(--mut);flex-wrap:wrap}
.hud b{color:var(--txt)}
.pill{background:var(--card2);border:1px solid var(--line);border-radius:999px;
  padding:5px 12px;white-space:nowrap}
.pill.streak{color:var(--amber)}
.bar{height:8px;background:var(--card2);border-radius:999px;overflow:hidden;margin-bottom:16px;border:1px solid var(--line)}
.bar>span{display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--teal),var(--purple));transition:width .35s}

.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:999px;margin-bottom:12px}
.tag.tf{background:rgba(96,165,250,.16);color:var(--blue);border:1px solid rgba(96,165,250,.3)}
.tag.fb{background:rgba(167,139,250,.16);color:var(--purple);border:1px solid rgba(167,139,250,.3)}

.q{font-size:1.18rem;font-weight:600;margin-bottom:20px;min-height:3.2em;display:flex;align-items:center}

/* T/F buttons */
.tf-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf-btn{padding:20px;border-radius:16px;border:2px solid var(--line);
  background:var(--card2);color:var(--txt);cursor:pointer;font-family:inherit;
  font-size:1.15rem;font-weight:700;transition:.15s}
.tf-btn:hover{transform:translateY(-2px)}
.tf-btn.t:hover{border-color:var(--green)}
.tf-btn.f:hover{border-color:var(--red)}
.tf-btn:disabled{opacity:.55;cursor:default;transform:none}

/* fill input */
.fb-row{display:flex;gap:10px;flex-wrap:wrap}
.fb-input{flex:1;min-width:180px;padding:15px;border-radius:14px;border:2px solid var(--line);
  background:var(--card2);color:var(--txt);font-family:inherit;font-size:1.05rem;outline:none}
.fb-input:focus{border-color:var(--teal);box-shadow:var(--glow)}
.fb-submit{padding:15px 22px;border:none;border-radius:14px;cursor:pointer;font-family:inherit;
  font-size:1rem;font-weight:700;color:#06231f;background:linear-gradient(135deg,var(--teal),var(--green))}
.fb-hint{margin-top:10px;font-size:.82rem;color:var(--mut)}
.linkbtn{background:none;border:none;color:var(--purple);cursor:pointer;font-family:inherit;
  font-size:.82rem;text-decoration:underline;padding:0}

/* feedback */
.fb{margin-top:18px;padding:16px;border-radius:14px;border:1px solid var(--line);display:none}
.fb.show{display:block;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fb.ok{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.4)}
.fb.no{background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.4)}
.fb .head{font-weight:700;font-size:1.05rem;margin-bottom:6px}
.fb.ok .head{color:var(--green)} .fb.no .head{color:var(--red)}
.fb .ans{font-size:.95rem;margin-bottom:6px}
.fb .ans b{color:var(--teal)}
.fb .exp{font-size:.9rem;color:var(--mut)}
.fb .warn{margin-top:8px;font-size:.82rem;color:var(--amber)}
.nextbtn{margin-top:14px;width:100%;padding:13px;border:none;border-radius:13px;cursor:pointer;
  font-family:inherit;font-size:1rem;font-weight:700;color:var(--txt);
  background:var(--card2);border:1px solid var(--teal)}
.nextbtn:hover{background:#22305a}

/* end screen */
.end{text-align:center}
.end .score{font-size:3rem;font-weight:700;
  background:linear-gradient(90deg,var(--teal),var(--purple));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.end .sub{color:var(--mut);margin:6px 0 18px}
.end .grade{font-size:1.2rem;font-weight:700;margin-bottom:18px}

.foot{text-align:center;color:var(--mut);font-size:.75rem;margin-top:18px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧠 เกมฝึกข้อสอบ — Unit 18 ระบบประสาท</h1>
    <p>ถูก/ผิด + เติมคำ · ฝึกจนชิน · เฉลย+เหตุผลทุกข้อ</p>
  </header>

  <!-- START -->
  <div class="card" id="startScreen">
    <div class="modes">
      <button class="mode-btn active" data-mode="mix">🎲 รวมมิตร<small>สลับ ถูก/ผิด + เติมคำ</small></button>
      <button class="mode-btn" data-mode="tf">✅❌ ถูก/ผิด<small>อย่างเดียว</small></button>
      <button class="mode-btn" data-mode="fb">✏️ เติมคำ<small>อย่างเดียว</small></button>
    </div>
    <div class="hud" style="margin-bottom:14px;flex-wrap:nowrap">
      <span class="pill" style="flex-shrink:0">จำนวนข้อต่อรอบ: <b id="lenLabel">20</b></span>
      <input type="range" id="lenRange" min="10" max="40" step="5" value="20" style="flex:1;min-width:120px">
    </div>
    <button class="startbtn" id="startBtn">เริ่มเล่น ▶</button>
    <p class="foot">มีคลังข้อสอบรวม <b id="poolCount">0</b> ข้อ (ชุดเดิม + ชุดใหม่) · สุ่มไม่ซ้ำจนกว่าจะครบ</p>
  </div>

  <!-- GAME -->
  <div class="card hidden" id="gameScreen">
    <div class="hud">
      <span class="pill">ข้อ <b id="qNow">1</b>/<b id="qTotal">20</b></span>
      <span class="pill">คะแนน <b id="score">0</b></span>
      <span class="pill streak">🔥 สตรีค <b id="streak">0</b></span>
    </div>
    <div class="bar"><span id="prog"></span></div>
    <span class="tag tf" id="qtag">ถูก / ผิด</span>
    <div class="q" id="qText">…</div>

    <!-- T/F controls -->
    <div class="tf-row" id="tfControls">
      <button class="tf-btn t" data-v="true">✅ ถูก</button>
      <button class="tf-btn f" data-v="false">❌ ผิด</button>
    </div>

    <!-- Fill controls -->
    <div id="fbControls" class="hidden">
      <div class="fb-row">
        <input class="fb-input" id="fbInput" placeholder="พิมพ์คำตอบ… (ไทยหรืออังกฤษ)" autocomplete="off">
        <button class="fb-submit" id="fbSubmit">ตอบ</button>
      </div>
      <div class="fb-hint"><button class="linkbtn" id="hintBtn">💡 ขอใบ้</button> <span id="hintTxt"></span></div>
    </div>

    <!-- feedback -->
    <div class="fb" id="feedback">
      <div class="head" id="fbHead"></div>
      <div class="ans" id="fbAns"></div>
      <div class="exp" id="fbExp"></div>
      <div class="warn hidden" id="fbWarn"></div>
      <button class="nextbtn" id="nextBtn">ข้อต่อไป →</button>
    </div>
  </div>

  <!-- END -->
  <div class="card hidden end" id="endScreen">
    <div class="score" id="endScore">0/0</div>
    <div class="sub" id="endPct">0%</div>
    <div class="grade" id="endGrade"></div>
    <button class="startbtn" id="againBtn">เล่นอีกครั้ง 🔁</button>
    <p class="foot" id="endTip"></p>
  </div>
</div>

<script>
/* ========== คลังข้อสอบ ========== */
// ถูก/ผิด : {q, a:true/false, e:เหตุผล, w:คำเตือนพิเศษ(optional)}
const TF = [
 // ---- ชุดเดิม ----
 {q:"เดนไดรต์ทำหน้าที่นำกระแสประสาทออกจากตัวเซลล์",a:false,e:"เดนไดรต์ \"รับ\" กระแสเข้าสู่ตัวเซลล์ ส่วนที่นำออกคือแอกซอน",w:"กับดักยอดฮิต: เดนไดรต์=รับเข้า / แอกซอน=ออก"},
 {q:"แอกซอนของเซลล์ประสาทสั่งการมีความยาวมาก",a:true,e:"ต้องส่งคำสั่งจาก CNS ไปไกลถึงหน่วยปฏิบัติงาน"},
 {q:"เยื่อไมอีลินสร้างจากเซลล์ชวันน์ และเป็นฉนวนไฟฟ้าที่ทำให้กระแสประสาทเร็วขึ้น",a:true,e:"เซลล์ชวันน์ห่อหุ้มแอกซอนเกิดเยื่อไมอีลิน"},
 {q:"ช่องว่างระหว่างเยื่อไมอีลินเรียกว่าไซแนปส์",a:false,e:"เรียกว่า โนดออฟแรนเวียร์ (ไซแนปส์คือรอยต่อระหว่างเซลล์ประสาท)"},
 {q:"เซลล์ประสาทขั้วเดียวพบที่เซลล์รับความรู้สึกบริเวณปมประสาทรากบนของไขสันหลัง",a:true,e:"unipolar neuron มีใยยื่นออกเส้นเดียว"},
 {q:"เซลล์รับแสงที่เรตินาเป็นเซลล์ประสาทหลายขั้ว (multipolar)",a:false,e:"เป็นเซลล์ประสาท สองขั้ว (bipolar)"},
 {q:"ตัวเซลล์ (cell body) เป็นแหล่งสังเคราะห์โปรตีนที่เป็นสารสื่อประสาท",a:true,e:"มีไรโบโซม/ER สำหรับสร้างโปรตีน"},
 {q:"ในระยะ Polarization ภายในเซลล์มีประจุบวก ภายนอกมีประจุลบ",a:false,e:"สลับกัน! Polarization: นอก + / ใน −",w:"จำ: พัก=นอกบวก, Na เข้าแล้วค่อยในบวก"},
 {q:"ระยะ Depolarization เกิดจาก Na⁺ แพร่เข้าเซลล์อย่างรวดเร็ว",a:true,e:"Na เข้า → ในเซลล์เป็นบวก"},
 {q:"ถ้ากระตุ้นไม่ถึงระดับ threshold จะไม่เกิดกระแสประสาท",a:true,e:"กฎ all-or-none"},
 {q:"Na-K pump ลำเลียงไอออนแบบ active transport โดยปั๊ม K⁺ เข้าและ Na⁺ ออก",a:true,e:"ใช้พลังงาน ATP"},
 {q:"ไซแนปส์ไฟฟ้าส่งกระแสประสาทได้ทั้งสองทิศทางผ่านแก๊ปจังก์ชัน",a:true,e:"เร็วมาก ไม่หน่วงเวลา"},
 {q:"ใยประสาทที่มีเยื่อไมอีลินส่งกระแสประสาทช้ากว่าใยที่ไม่มี",a:false,e:"มีไมอีลิน → เร็วกว่า ~10 เท่า"},
 {q:"ยิ่งมีไซแนปส์มาก กระแสประสาทยิ่งส่งได้เร็ว",a:false,e:"ไซแนปส์ยิ่ง น้อย ยิ่งเร็ว"},
 {q:"CNS ประกอบด้วยสมองและไขสันหลัง",a:true,e:"PNS = เส้นประสาทที่แยกออกมา"},
 {q:"ซีรีเบลลัม (cerebellum) ทำหน้าที่ควบคุมการทรงตัวของร่างกาย",a:true,e:"และประสานการเคลื่อนไหว"},
 {q:"เมดัลลาออบลองกาตาควบคุมการเต้นของหัวใจและการหายใจ",a:true,e:"ศูนย์ควบคุมนอกอำนาจจิตใจ"},
 {q:"ก้านสมอง (brainstem) ประกอบด้วยซีรีบรัม พอนส์ และเมดัลลาออบลองกาตา",a:false,e:"ก้านสมอง = สมองส่วนกลาง + พอนส์ + เมดัลลา (ไม่มีซีรีบรัม)"},
 {q:"ไฮโพทาลามัสควบคุมการหลั่งฮอร์โมนของต่อมใต้สมองและรักษาสมดุลอุณหภูมิร่างกาย",a:true,e:"ศูนย์ระบบประสาทอัตโนวัติ"},
 {q:"ทาลามัสเป็นสถานีถ่ายทอดกระแสประสาทไปยังส่วนต่าง ๆ ของสมอง",a:true,e:"และรับรู้ความเจ็บปวด"},
 {q:"ในมนุษย์ ออลแฟกทอรีบัลบ์มีขนาดใหญ่กว่าสัตว์มีกระดูกสันหลังชนิดอื่น",a:false,e:"ในมนุษย์มีขนาด เล็ก"},
 {q:"เนื้อสีขาว (white matter) ของไขสันหลังอยู่รอบนอก และมีเฉพาะใยประสาทที่มีเยื่อไมอีลิน",a:true,e:"เนื้อสีเทาอยู่ตรงกลางรูปปีกผีเสื้อ"},
 {q:"ในไขสันหลัง รากบน (dorsal root) ทำหน้าที่สั่งการ ส่วนรากล่าง (ventral root) ทำหน้าที่รับความรู้สึก",a:false,e:"สลับกัน! รากบน=รับความรู้สึก, รากล่าง=สั่งการ",w:"ออกสอบบ่อยมาก: Dorsal=รับเข้า, Ventral=ออก"},
 {q:"การทดลองในกบที่ถูกทำลายสมองแล้ว พบว่ากบยังตอบสนองต่อสิ่งเร้าได้ด้วยไขสันหลัง",a:true,e:"รีเฟล็กซ์ใช้แค่ไขสันหลังก็ได้"},
 {q:"มนุษย์มีเส้นประสาทสมอง 12 คู่ และเส้นประสาทไขสันหลัง 31 คู่",a:true,e:"ตัวเลขสำคัญ 12 และ 31"},
 {q:"เส้นประสาทไขสันหลังทุกคู่เป็นเส้นประสาทผสม (mixed nerve)",a:true,e:"มีทั้งรับและสั่งการ"},
 {q:"เส้นประสาทสมองคู่ที่ 1 รับความรู้สึกเกี่ยวกับการมองเห็น",a:false,e:"คู่ที่ 1 = กลิ่น; การมองเห็น = คู่ที่ 2"},
 {q:"รีเฟล็กซ์แอกชันเป็นการตอบสนองที่สั่งการโดยไขสันหลัง โดยสมองไม่ต้องสั่งการ",a:true,e:"เกิดเองทันที ป้องกันตัว"},
 {q:"ระบบประสาทอัตโนวัติควบคุมกล้ามเนื้อโครงร่าง",a:false,e:"อัตโนวัติคุมกล้ามเนื้อเรียบ+หัวใจ; กล้ามเนื้อโครงร่างเป็นของโซมาติก"},
 {q:"ระบบประสาทซิมพาเทติก (sympathetic) ทำงานในสภาวะ \"สู้หรือหนี\" (fight-or-flight)",a:true,e:"พาราซิมพาเทติก = พักและย่อย"},
 {q:"ระบบประสาทพาราซิมพาเทติกหลั่งสารสื่อประสาท acetylcholine",a:true,e:"ตามหลักสรีรวิทยา พาราฯ=acetylcholine, ซิมพาฯ=norepinephrine",w:"⚠️ สไลด์อาจารย์พิมพ์สลับ! ถ้าข้อสอบอ้างตามสไลด์ให้ดูบริบท"},
 {q:"เมื่อระบบซิมพาเทติกทำงาน รูม่านตาจะหรี่ลงและหัวใจเต้นช้าลง",a:false,e:"ซิมพาฯ: รูม่านตา ขยาย + หัวใจเต้น เร็วขึ้น"},
 {q:"ระบบประสาทเอนเทอริกควบคุมทางเดินอาหารได้โดยไม่ต้องอาศัย CNS",a:true,e:"ระบบประสาทของลำไส้โดยเฉพาะ"},
 {q:"เซลล์รูปแท่ง (rod) ไวต่อแสงน้อยและแยกสีไม่ได้",a:true,e:"เห็นเป็นขาว-ดำ; cone แยกสี"},

/* ========== เครื่องมือ ========== */
const norm = s => (s||"").toString().toLowerCase()
  .replace(/[\s\.\,\(\)\-_'"“”็ฺ่้๊๋]/g,"")  // ตัดช่องว่าง/วรรคตอน/วรรณยุกต์
  .replace(/์/g,"");
function fbMatch(input, answers){
  const u = norm(input);
  if(!u) return false;
  return answers.some(a=>{ const n=norm(a); return u===n || u.includes(n) || n.includes(u) && u.length>=Math.max(2,n.length-1); });
}

// shuffle-bag
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ========== สถานะเกม ========== */
let mode="mix", roundLen=20, queue=[], idx=0, score=0, streak=0, maxStreak=0, answered=false, hintLv=0;

document.getElementById('poolCount').textContent = TF.length+FB.length;

// mode buttons
document.querySelectorAll('.mode-btn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.mode-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); mode=b.dataset.mode;
});
const lenRange=document.getElementById('lenRange'), lenLabel=document.getElementById('lenLabel');
lenRange.oninput=()=>lenLabel.textContent=lenRange.value;

document.getElementById('startBtn').onclick=start;
document.getElementById('againBtn').onclick=()=>{document.getElementById('endScreen').classList.add('hidden');document.getElementById('startScreen').classList.remove('hidden');};

function buildQueue(){
  let pool=[];
  const tf = shuffle(TF).map(x=>({type:'tf',...x}));
  const fb = shuffle(FB).map(x=>({type:'fb',...x}));
  if(mode==='tf') pool=tf;
  else if(mode==='fb') pool=fb;
  else { // mix สลับ
    const m=[]; const n=Math.max(tf.length,fb.length);
    for(let i=0;i<n;i++){ if(tf[i])m.push(tf[i]); if(fb[i])m.push(fb[i]); }
    pool=m;
  }
  return pool.slice(0, Math.min(roundLen, pool.length));
}

function start(){
  roundLen=parseInt(lenRange.value);
  queue=buildQueue(); idx=0; score=0; streak=0; maxStreak=0;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  document.getElementById('qTotal').textContent=queue.length;
  render();
}

function render(){
  answered=false; hintLv=0;
  const item=queue[idx];
  document.getElementById('qNow').textContent=idx+1;
  document.getElementById('score').textContent=score;
  document.getElementById('streak').textContent=streak;
  document.getElementById('prog').style.width=((idx)/queue.length*100)+'%';
  document.getElementById('feedback').classList.remove('show','ok','no');
  document.getElementById('fbWarn').classList.add('hidden');
  document.getElementById('hintTxt').textContent='';

  const tag=document.getElementById('qtag');
  document.getElementById('qText').textContent=item.q;

  if(item.type==='tf'){
    tag.className='tag tf'; tag.textContent='✅❌ ถูก / ผิด';
    document.getElementById('tfControls').classList.remove('hidden');
    document.getElementById('fbControls').classList.add('hidden');
    document.querySelectorAll('.tf-btn').forEach(b=>{b.disabled=false;});
  } else {
    tag.className='tag fb'; tag.textContent='✏️ เติมคำ';
    document.getElementById('tfControls').classList.add('hidden');
    document.getElementById('fbControls').classList.remove('hidden');
    const inp=document.getElementById('fbInput'); inp.value=''; inp.disabled=false; inp.focus();
  }
}

// T/F answer
document.querySelectorAll('.tf-btn').forEach(b=>b.onclick=()=>{
  if(answered) return;
  const item=queue[idx];
  judge(b.dataset.v==='true' === item.a, item);
  document.querySelectorAll('.tf-btn').forEach(x=>x.disabled=true);
});

// Fill answer
document.getElementById('fbSubmit').onclick=submitFB;
document.getElementById('fbInput').addEventListener('keydown',e=>{if(e.key==='Enter')submitFB();});
function submitFB(){
  if(answered) return;
  const item=queue[idx];
  const val=document.getElementById('fbInput').value;
  if(!val.trim()) return;
  document.getElementById('fbInput').disabled=true;
  judge(fbMatch(val,item.a), item);
}

// hint
document.getElementById('hintBtn').onclick=()=>{
  const item=queue[idx]; if(item.type!=='fb'||answered) return;
  hintLv++;
  if(hintLv===1) document.getElementById('hintTxt').textContent='💡 '+(item.h||'ลองนึกถึงคำสำคัญในบทเรียน');
  else document.getElementById('hintTxt').textContent='💡 ตัวอย่างคำตอบ: '+item.a[0].slice(0,2)+'…';
};

function judge(correct,item){
  answered=true;
  const fb=document.getElementById('feedback');
  fb.classList.add('show', correct?'ok':'no');
  document.getElementById('fbHead').textContent = correct? '🎉 ถูกต้อง!' : '❌ ยังไม่ใช่';
  let ansText='';
  if(item.type==='tf') ansText='เฉลย: <b>'+(item.a?'ถูก ✅':'ผิด ❌')+'</b>';
  else ansText='เฉลย: <b>'+item.a[0]+'</b>';
  document.getElementById('fbAns').innerHTML=ansText;
  document.getElementById('fbExp').textContent=item.e||'';
  if(item.w){ const w=document.getElementById('fbWarn'); w.textContent='⚠️ '+item.w; w.classList.remove('hidden'); }

  if(correct){ score++; streak++; maxStreak=Math.max(maxStreak,streak); }
  else streak=0;
  document.getElementById('score').textContent=score;
  document.getElementById('streak').textContent=streak;
}

document.getElementById('nextBtn').onclick=()=>{
  idx++;
  if(idx>=queue.length) finish();
  else render();
};

function finish(){
  document.getElementById('gameScreen').classList.add('hidden');
  const es=document.getElementById('endScreen'); es.classList.remove('hidden');
  const pct=Math.round(score/queue.length*100);
  document.getElementById('endScore').textContent=score+'/'+queue.length;
  document.getElementById('endPct').textContent=pct+'% · สตรีคสูงสุด 🔥'+maxStreak;
  let g,tip;
  if(pct>=90){g='🏆 เทพระบบประสาท!';tip='แม่นมาก พร้อมสอบแล้ว ลองสลับโหมดอื่นต่อ';}
  else if(pct>=75){g='💪 เก่งมาก!';tip='เหลือนิดเดียว ทบทวนข้อที่พลาดอีกรอบ';}
  else if(pct>=50){g='📘 มาถูกทางแล้ว';tip='เปิดไฟล์สรุปทวนหัวข้อที่ยังพลาด แล้วเล่นใหม่';}
  else {g='🌱 สู้ ๆ ค่อย ๆ เก็บ';tip='ลองอ่านสรุปก่อน แล้วเริ่มจากโหมดถูก/ผิดอย่างเดียว';}
  document.getElementById('endGrade').textContent=g;
  document.getElementById('endTip').textContent=tip;
}
</script>

/* ===== เครื่องคิดเลข ===== */
#kitui-calc{height:auto;max-height:90vh}
.kitui-disp{padding:8px 12px;text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--soft);
  border-bottom:1px solid var(--line)}
.kitui-disp .ex{font-size:.95rem;color:var(--muted);min-height:1.3em;word-break:break-all}
.kitui-disp .rs{font-size:1.6rem;font-weight:700;color:var(--accent-ink);word-break:break-all}
.kitui-keys{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:7px}
.kitui-keys button{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:9px;
  font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer;min-height:44px;padding:2px}
.kitui-keys button:active{transform:scale(.95)}
.kitui-keys button.fn{font-size:.8rem;color:var(--accent-ink)}
.kitui-keys button.op{background:var(--accent-soft);color:var(--accent-ink)}
.kitui-keys button.eq{background:var(--accent);color:#fff;grid-row:span 2}
.kitui-keys button.del{background:var(--hot-bg);color:var(--hot-ink)}

@media(max-width:420px){.kitui-keys button{font-size:.88rem;min-height:40px}.kitui-keys button.fn{font-size:.72rem}}
@media(min-width:760px){
  .kitui-sheet{left:auto;right:12px;bottom:12px;width:430px;border-radius:16px;border:1px solid var(--line)}
  .kitui-sheet.full{left:0;right:0;width:auto;height:100vh;border-radius:0}
  #kitui-pad{width:560px}
}

`;
const st=el('style'); st.id='kitui-style'; st.textContent=CSS; D.head.appendChild(st);

/* -----------------------------------------------------------------------------
   1.5) ซ่อมโหมดมืดให้ widget รุ่นเก่า
   widget หลายไฟล์เขียนสีพื้นตายตัวไว้ (background:#fff, #ecfdf5, #fef2f2 ฯลฯ)
   พอสลับเป็นโหมดมืด ตัวหนังสือจะกลายเป็นสีอ่อนบนพื้นอ่อน = อ่านไม่ออก
   แก้แบบทั่วไป: ไล่อ่านทุกกฎ CSS ในหน้า หากพื้นหลัง "สว่างมาก" ให้สร้างกฎทับ
   เฉพาะตอนโหมดมืด โดยคงเฉดสีเดิมไว้แต่ทำให้เข้ม (ไม่ต้องไปแก้ทีละไฟล์)
----------------------------------------------------------------------------- */
/* สีพาสเทลสว่าง -> สีเข้มที่ยังคง "เฉดเดิม" ไว้ (เขียว=ถูก / แดง=ผิด ต้องยังแยกออก)
   ทำผ่าน HSL: คง H, ดัน S ขึ้นให้ยังเห็นสี, กด L ลงให้เข้ม */
function darken(cr,cg,cb){
  const r=cr/255,g=cg/255,b=cb/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  let h=0; if(d){ h = mx===r ? ((g-b)/d+(g<b?6:0)) : mx===g ? ((b-r)/d+2) : ((r-g)/d+4); h*=60; }
  /* ⚠️ ห้ามใช้ saturation ของ HSL ตรง ๆ ตัดสิน: ที่ความสว่างเกือบ 1 ตัวหารจะเล็กมาก
     ทำให้สีที่แทบเป็นสีขาว (เช่น #fdf8f4) ได้ค่าอิ่มสีสูงลิ่ว แล้วกลายเป็นสีน้ำตาลจัดตอนกดให้เข้ม
     ให้ดูจาก "ช่วงห่างของแม่สี" (chroma) แทน แล้วแปลงเป็นความอิ่มสีแบบไล่ระดับ */
  const s = Math.min(.45, Math.max(.08, d*4));
  const l = d<.02 ? .13 : .17;                       /* เทา/ขาวล้วนให้เข้มกว่าสีนิดหน่อย */
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m2=l-c/2;
  let rr,gg,bb;
  if(h<60){rr=c;gg=x;bb=0}else if(h<120){rr=x;gg=c;bb=0}else if(h<180){rr=0;gg=c;bb=x}
  else if(h<240){rr=0;gg=x;bb=c}else if(h<300){rr=x;gg=0;bb=c}else{rr=c;gg=0;bb=x}
  return 'rgb('+Math.round((rr+m2)*255)+','+Math.round((gg+m2)*255)+','+Math.round((bb+m2)*255)+')';
}
function darkFix(){
  const out=[], seen=new Set();
  const take=r=>{
    if(!r.style || !r.selectorText) return;
    if(r.selectorText.indexOf('kitui')>-1) return;               /* ของเราเองใช้ token อยู่แล้ว */
    const bg=r.style.backgroundColor;
    if(!bg || bg.indexOf('var(')>-1) return;
    const m=bg.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?/);
    if(!m) return;
    if(m[4]!==undefined && +m[4]<0.6) return;                    /* โปร่งใสอยู่แล้ว ปล่อยไว้ */
    const cr=+m[1], cg=+m[2], cb=+m[3];
    if((0.2126*cr+0.7152*cg+0.0722*cb)/255 < 0.82) return;       /* ไม่สว่างพอ ไม่ต้องยุ่ง */
    const key=r.selectorText+'|'+bg; if(seen.has(key)) return; seen.add(key);
    const repl = (cr>250&&cg>250&&cb>250) ? 'var(--card)' : darken(cr,cg,cb);
    let css='background-color:'+repl;
    /* ถ้ากฎนั้นกำหนดสีตัวอักษรเข้มไว้ด้วย ต้องพลิกเป็นสีอ่อน ไม่งั้นดำบนดำ */
    const fg=r.style.color, fm=fg&&fg.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    if(fm && (0.2126*+fm[1]+0.7152*+fm[2]+0.0722*+fm[3])/255 < 0.5) css+=';color:var(--ink)';
    out.push(':root[data-theme="dark"] '+r.selectorText+'{'+css+'}');
  };
  /* ⚠️ กฎธรรมดาก็มี .cssRules เป็น list "ว่าง" ได้ (รองรับ CSS nesting)
        ห้ามใช้ if(r.cssRules) แล้ว continue ไม่งั้นข้ามทุกกฎ */
  const visit=rules=>{
    for(let i=0;i<rules.length;i++){
      const r=rules[i];
      if(r.selectorText) take(r);
      if(r.cssRules && r.cssRules.length) visit(r.cssRules);     /* @media / @supports / nesting */
    }
  };
  for(let i=0;i<D.styleSheets.length;i++){
    let rr; try{ rr=D.styleSheets[i].cssRules; }catch(e){ continue; }   /* ข้ามชีตข้ามโดเมน */
    if(rr) visit(rr);
  }
  if(out.length){ const s=el('style'); s.id='kitui-darkfix'; s.textContent=out.join('\n'); D.head.appendChild(s); }
  return out.length;
}
try{ window.__KITUI_DARKFIX__ = (D.body.getAttribute('data-kit-theme')==='off') ? 'locked' : darkFix(); }
catch(e){ window.__KITUI_DARKFIX__='err:'+e.message; }

/* darkFix ข้างบนซ่อมได้เฉพาะสีที่เขียนตายตัวในไฟล์ CSS
   แต่ยังมีอีกกรณี: widget ใช้ตัวแปรธีมเป็น "พื้นหลัง" เช่น background:var(--accent-head)
   ซึ่งในโหมดมืดตัวแปรนั้นกลายเป็นสีอ่อน (เพราะปกติใช้เป็นสีหัวข้อ) -> อ่อนบนอ่อน
   จับกรณีนี้ตอนรันจริง: ถ้าพื้นหลัง "สว่าง" และตัวหนังสือก็ "สว่าง" = อ่านไม่ออกแน่นอน ให้กดพื้นให้เข้ม */
const rgbOf=c=>{const m=c&&c.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?/);return m?[+m[1],+m[2],+m[3],m[4]===undefined?1:+m[4]]:null;};
const lumOf=v=>v?(0.2126*v[0]+0.7152*v[1]+0.0722*v[2])/255:null;
/* ตรงข้ามกับ darken(): ดึงสีตัวอักษรเข้ม ๆ ให้สว่างขึ้นแต่คงเฉดเดิม
   (เช่น สูตรสีน้ำเงินเข้ม -> ฟ้าอ่อน ไม่ใช่กลายเป็นขาวหมดจนแยกไม่ออก) */
function lighten(cr,cg,cb){
  const r=cr/255,g=cg/255,b=cb/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  if(d<0.04) return 'var(--ink)';                    /* เทา/ดำล้วน -> ใช้สีตัวอักษรของธีม */
  let h = mx===r ? ((g-b)/d+(g<b?6:0)) : mx===g ? ((b-r)/d+2) : ((r-g)/d+4); h*=60;
  const l0=(mx+mn)/2, s0=d/(1-Math.abs(2*l0-1));
  const s=Math.min(.92,Math.max(.55,s0)), l=.72;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m2=l-c/2;
  let rr,gg,bb;
  if(h<60){rr=c;gg=x;bb=0}else if(h<120){rr=x;gg=c;bb=0}else if(h<180){rr=0;gg=c;bb=x}
  else if(h<240){rr=0;gg=x;bb=c}else if(h<300){rr=x;gg=0;bb=c}else{rr=c;gg=0;bb=x}
  return 'rgb('+Math.round((rr+m2)*255)+','+Math.round((gg+m2)*255)+','+Math.round((bb+m2)*255)+')';
}
const SKIP={CANVAS:1,IMG:1,VIDEO:1,SVG:1,IFRAME:1,PICTURE:1,OBJECT:1};
const OBS_OPT={childList:true,subtree:true,attributes:true,attributeFilter:['class','style']};
let patched=[], obs=null;
function elementFix(){
  /* ⚠️ ตัวเราเองแก้ inline style => MutationObserver จะเด้งกลับมาเรียกซ้ำไม่รู้จบ (กินแบตมือถือ)
        ต้องปลดการเฝ้าดูระหว่างทำงาน แล้วค่อยต่อกลับ */
  if(obs) obs.disconnect();
  try{ elementFixCore(); } finally { if(obs) obs.observe(D.body,OBS_OPT); }
}
function elementFixCore(){
  if(D.body.getAttribute('data-kit-theme')==='off') return;   /* หน้าที่ล็อกธีมไว้ ห้ามไปยุ่งสี */
  /* ⚠️ ห้ามลบสีเดิมทิ้งทุกครั้งที่สแกน! หน้าที่มี transition จะเริ่มไล่สีใหม่ทุกๆ รอบ = กะพริบไม่หยุด
     ตอนอยู่โหมดมืดให้ "ทาเฉพาะตัวที่ยังสว่าง" เท่านั้น ตัวที่ทาไปแล้วจะคำนวณได้ค่าเข้ม -> ถูกข้ามเอง
     จะลบสีที่เราทาไว้ ก็ต่อเมื่อสลับกลับเป็นโหมดสว่างเท่านั้น */
  if(R.getAttribute('data-theme')!=='dark'){
    patched.forEach(e=>{ e.style.removeProperty('background-color'); e.style.removeProperty('color'); });
    patched=[];
    return;
  }
  /* ไล่ทั้งหน้า: อะไรที่พื้นยัง "สว่าง" อยู่ในโหมดมืด ให้กดให้เข้ม (คงเฉดสีเดิม)
     ครอบคลุมทั้งกรณีสีเขียนตายตัว, สีจากตัวแปรธีม, และไฟล์ CSS แยกที่อ่านกฎไม่ได้ */
  /* ต้องรวม html/body ด้วย บาง widget ตั้งพื้นหลังหน้าไว้ที่สองตัวนี้ (querySelectorAll ไม่นับ) */
  const all=[R, D.body].concat([].slice.call(D.body.querySelectorAll('*')));
  for(let i=0;i<all.length;i++){
    const e=all[i];
    if(e.id&&e.id.indexOf('kitui')===0) continue;
    if(e.closest&&(e.closest('#kitui-bar')||e.closest('.kitui-sheet'))) continue;
    if(SKIP[e.tagName]) continue;                      /* พื้นที่วาดภาพ/สื่อ อย่าไปยุ่ง */
    const s=getComputedStyle(e);
    const bg=rgbOf(s.backgroundColor);
    if(!bg || bg[3]<0.6) continue;                     /* โปร่งใส = เห็นพื้นข้างหลังอยู่แล้ว */
    if(lumOf(bg)<0.72) continue;                       /* เข้มพออยู่แล้ว */
    /* ต้องใส่ important เพราะบาง widget ประกาศ background ... !important ไว้ ซึ่งชนะ inline ธรรมดา */
    e.style.setProperty('background-color', darken(bg[0],bg[1],bg[2]), 'important');
    const fg=rgbOf(s.color);
    if(fg && lumOf(fg)<0.5) e.style.setProperty('color','var(--ink)','important');  /* ตัวหนังสือเข้ม -> พลิกเป็นอ่อน */
    patched.push(e);
  }
  /* รอบสอง: ตัวอักษรสีเข้มที่ "ตกอยู่บนพื้นเข้ม" (พื้นมาจาก element แม่ที่เพิ่งถูกกดให้มืด)
     ถ้าไม่พลิกด้วย จะกลายเป็นเข้มบนเข้ม อ่านไม่ออก — คงเฉดสีเดิมไว้ให้ยังแยกความหมายได้ */
  const bgCache=new Map();
  const effBg=n=>{
    for(let p=n;p;p=p.parentElement){
      if(bgCache.has(p)) return bgCache.get(p);
      const b=rgbOf(getComputedStyle(p).backgroundColor);
      if(b && b[3]>0.5){ bgCache.set(n,b); return b; }
    }
    return null;
  };
  for(let i=2;i<all.length;i++){
    const e=all[i];
    if(SKIP[e.tagName] || (e.id&&e.id.indexOf('kitui')===0)) continue;
    if(e.closest&&(e.closest('#kitui-bar')||e.closest('.kitui-sheet'))) continue;
    if(e.style.color) continue;                         /* จัดการไปแล้วในรอบแรก */
    if(!e.textContent || !e.textContent.trim()) continue;
    const fg=rgbOf(getComputedStyle(e).color);
    if(!fg || lumOf(fg)>=0.45) continue;                 /* ตัวอักษรสว่างอยู่แล้ว */
    const bg=effBg(e);
    if(!bg || lumOf(bg)>=0.5) continue;                  /* พื้นยังสว่าง อ่านออกอยู่ */
    e.style.setProperty('color', lighten(fg[0],fg[1],fg[2]), 'important');
    patched.push(e);
  }
}
let efT=0;
const scheduleFix=()=>{ clearTimeout(efT); efT=setTimeout(elementFix,220); };
try{
  obs=new MutationObserver(scheduleFix);
  obs.observe(D.body,OBS_OPT);
}catch(e){}

/* =============================================================================
   2) ธีม + ขนาดตัวอักษร
   ============================================================================= */
const FS=[.85,1,1.15,1.3,1.5], FSNAME=['เล็กสุด','เล็ก','ปกติ','ใหญ่','ใหญ่สุด'];
let fsIdx=parseInt(get('fs')); if(isNaN(fsIdx)||fsIdx<0||fsIdx>4) fsIdx=1;
let theme=get('theme') || (matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');

/* หน้าที่ออกแบบธีมมาเองครบแล้ว (เช่น "หนังสือทบทวน" พื้นเข้มทั้งเล่ม) ให้ปิดระบบธีมของ KIT UI
   ไม่งั้นโทเคน --bg/--ink ของเราจะไปทับสีที่หน้านั้นตั้งไว้ แล้วหน้าเพี้ยน
   ใส่ที่ tag body:  data-kit-theme="off"   (ปุ่มปรับขนาดตัวอักษรยังใช้ได้ตามปกติ) */
const themeLock = D.body.getAttribute('data-kit-theme')==='off';

function applyTheme(){
  if(themeLock) return;
  R.setAttribute('data-theme',theme);
  R.style.colorScheme = theme==='dark'?'dark':'light';   /* ให้ select/input เป็นสีเข้มด้วย */
  const b=D.getElementById('kitui-theme'); if(b){b.textContent=theme==='dark'?'☀️':'🌙';b.title=theme==='dark'?'สลับเป็นโหมดสว่าง':'สลับเป็นโหมดมืด';}
  set('theme',theme);
  clearTimeout(efT);                                   /* ยกเลิกคิวเก่าที่ค้างจากธีมก่อนหน้า */
  if(typeof elementFix==='function') elementFix();
  /* ⚠️ ห้ามอ้างถึงตัวแปรของส่วน "ที่ทด" ตรงนี้!
     applyTheme() ถูกเรียกก่อนที่ `let pad` ในส่วนที่ 4 จะทำงาน → ชน temporal dead zone
     แล้ว ReferenceError จะทำให้สคริปต์ตายทั้งก้อน (ปุ่มขนาดอักษร/ที่ทด/เครื่องคิดเลขหายหมด)
     ใช้วิธียิง event แทน ใครสนใจค่อยไปดักฟังเอง */
  try{ D.dispatchEvent(new CustomEvent('kitui-theme')); }catch(e){}
}
function applyFS(){
  R.style.fontSize=(16*FS[fsIdx])+'px';
  const l=D.getElementById('kitui-fslabel'); if(l)l.textContent=FSNAME[fsIdx];
  set('fs',fsIdx);
}

/* =============================================================================
   3) แถบเครื่องมือ
   ============================================================================= */
const subj=(D.body.getAttribute('data-subject')||'').toLowerCase();
/* หลาย widget ไม่ได้ใส่ data-subject ที่ <body> → เดาจากโฟลเดอร์ที่ไฟล์อยู่ด้วย */
const inPath=/\/(physics|math|chemist)\//i.test(decodeURIComponent(location.pathname));
const tAttr=D.body.getAttribute('data-tools');
const wantTools = tAttr!=null ? tAttr.toLowerCase()
                : ((['math','physics','chem'].includes(subj) || inPath) ? 'pen,calc' : '');
const hasPen  = wantTools.includes('pen');
const hasCalc = wantTools.includes('calc');

const bar=el('div'); bar.id='kitui-bar';
bar.innerHTML =
  `<button id="kitui-grip" title="ย่อ/ขยายแถบเครื่องมือ">⚙️</button>`+
  (themeLock ? '' : `<button id="kitui-theme" title="สลับโหมดมืด/สว่าง">🌙</button><span class="kitui-sep"></span>`)+
  `<button id="kitui-fsdown" title="ตัวหนังสือเล็กลง">A−</button>`+
  `<span class="kitui-fs" id="kitui-fslabel">ปกติ</span>`+
  `<button id="kitui-fsup" title="ตัวหนังสือใหญ่ขึ้น">A+</button>`+
  (hasPen ? `<span class="kitui-sep"></span><button id="kitui-penbtn" title="ที่ทด (เขียนด้วยปากกา)">✏️</button>`:'')+
  (hasCalc? `<button id="kitui-calcbtn" title="เครื่องคิดเลขวิทยาศาสตร์">🧮</button>`:'');
D.body.appendChild(bar);

if(!themeLock) D.getElementById('kitui-theme').onclick=()=>{theme=theme==='dark'?'light':'dark';applyTheme();};
D.getElementById('kitui-fsup').onclick=()=>{if(fsIdx<4){fsIdx++;applyFS();}};
D.getElementById('kitui-fsdown').onclick=()=>{if(fsIdx>0){fsIdx--;applyFS();}};
D.getElementById('kitui-grip').onclick=()=>bar.classList.toggle('hidden');
applyTheme(); applyFS();

/* ปิดแผงด้วยปุ่ม Esc */
D.addEventListener('keydown',e=>{ if(e.key==='Escape') D.querySelectorAll('.kitui-sheet.open').forEach(s=>s.classList.remove('open')); });

/* ลากหัวแผงเพื่อปรับความสูง */
function makeResizable(sheet){
  const head=sheet.querySelector('.kitui-head'); let y0=0,h0=0,drag=false;
  head.addEventListener('pointerdown',e=>{
    if(e.target.closest('button'))return;
    drag=true;y0=e.clientY;h0=sheet.getBoundingClientRect().height;head.setPointerCapture(e.pointerId);
  });
  head.addEventListener('pointermove',e=>{
    if(!drag)return;
    const h=Math.min(innerHeight*.95,Math.max(180,h0+(y0-e.clientY)));
    sheet.classList.remove('full'); sheet.style.height=h+'px';
    if(sheet.id==='kitui-pad') fitPad();
  });
  head.addEventListener('pointerup',e=>{drag=false;try{head.releasePointerCapture(e.pointerId)}catch(x){}});
}

/* =============================================================================
   4) ที่ทด — ปากกา / ปากกาเน้น / ยางลบ  หลายหน้า  เซฟอัตโนมัติ
   ============================================================================= */
let pad,padCv,padCx,pages=[[]],pg=0,undone=[],histo=[];
let tool='pen',color='#111827',width=2.4,penSeen=0;
const COLORS=['#111827','#2563eb','#dc2626','#16a34a','#f59e0b'];
const PADKEY='pad-'+location.pathname.split('/').pop();

function buildPad(){
  pad=el('div','kitui-sheet'); pad.id='kitui-pad';
  pad.innerHTML=
   `<div class="kitui-head">
      <b>✏️ ที่ทด</b>
      <button data-t="pen" class="on">🖊️</button>
      <button data-t="hl">🖍️</button>
      <button data-t="er">🧽</button>
      ${COLORS.map((c,i)=>`<button class="kitui-sw${i===0?' on':''}" data-c="${c}" style="background:${c}"></button>`).join('')}
      <button data-w="1.2">เส้นบาง</button><button data-w="2.4" class="on">กลาง</button><button data-w="4.5">หนา</button>
      <span class="kitui-spacer"></span>
      <button id="kitui-undo">↶</button><button id="kitui-redo">↷</button>
      <button id="kitui-pgprev">‹</button><span id="kitui-pgnum" style="font-size:.82rem;font-weight:700">1/1</span><button id="kitui-pgnext">›</button>
      <button id="kitui-pgadd">+ หน้า</button>
      <button id="kitui-clear">ล้างหน้านี้</button>
      <button id="kitui-full">⛶</button>
      <button id="kitui-padclose">✕</button>
    </div>
    <div class="kitui-padwrap"><canvas></canvas></div>`;
  D.body.appendChild(pad);
  padCv=pad.querySelector('canvas'); padCx=padCv.getContext('2d');
  makeResizable(pad);

  pad.querySelector('.kitui-head').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return;
    if(b.dataset.t){tool=b.dataset.t;pad.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));}
    if(b.dataset.c){color=b.dataset.c;pad.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));}
    if(b.dataset.w){width=+b.dataset.w;pad.querySelectorAll('[data-w]').forEach(x=>x.classList.toggle('on',x===b));}
  });
  D.getElementById('kitui-undo').onclick=()=>{ if(histo.length){ undone.push(pages[pg]); pages[pg]=histo.pop(); draw(); save(); } };
  D.getElementById('kitui-redo').onclick=()=>{ if(undone.length){ histo.push(pages[pg]); pages[pg]=undone.pop(); draw(); save(); } };
  D.getElementById('kitui-clear').onclick=()=>{ snap(); pages[pg]=[]; draw(); save(); };
  D.getElementById('kitui-pgadd').onclick=()=>{ pages.splice(pg+1,0,[]); pg++; histo=[];undone=[]; draw(); save(); };
  D.getElementById('kitui-pgprev').onclick=()=>{ if(pg>0){pg--;histo=[];undone=[];draw();} };
  D.getElementById('kitui-pgnext').onclick=()=>{ if(pg<pages.length-1){pg++;histo=[];undone=[];draw();} };
  D.getElementById('kitui-full').onclick=()=>{ pad.classList.toggle('full'); pad.style.height=''; fitPad(); };
  D.getElementById('kitui-padclose').onclick=()=>pad.classList.remove('open');

  /* ---- วาด ---- */
  let cur=null;
  padCv.addEventListener('pointerdown',e=>{
    if(e.pointerType==='pen') penSeen=Date.now();
    if(e.pointerType==='touch' && Date.now()-penSeen<1500) return;   /* กันฝ่ามือแตะตอนใช้สไตลัส */
    const p=pt(e);
    if(tool==='er'){ snap(); erase(p); return; }
    snap();
    cur={c:color,w:width,hl:tool==='hl',pts:[p]};
    pages[pg].push(cur); draw();
    try{ padCv.setPointerCapture(e.pointerId); }catch(x){}  /* บางเบราว์เซอร์/ปากกาโยน error ตรงนี้ ห้ามให้ล้มทั้งเส้น */
  });
  padCv.addEventListener('pointermove',e=>{
    if(e.pointerType==='touch' && Date.now()-penSeen<1500) return;
    if(tool==='er'&&e.buttons){ erase(pt(e)); return; }
    if(!cur||!e.buttons)return;
    /* getCoalescedEvents ให้ลายลื่นขึ้นตอนลากเร็ว แต่บางกรณีคืนอาร์เรย์ว่าง → ต้อง fallback ไม่งั้นเส้นหาย */
    let evs=[e];
    if(e.getCoalescedEvents){ const c=e.getCoalescedEvents(); if(c&&c.length) evs=c; }
    evs.forEach(ev=>cur.pts.push(pt(ev)));
    draw();
  });
  const end=()=>{ if(cur){cur=null;save();} };
  padCv.addEventListener('pointerup',end); padCv.addEventListener('pointercancel',end);
  padCv.addEventListener('pointerleave',end);

  addEventListener('resize',()=>{ if(pad.classList.contains('open')) fitPad(); });
  D.addEventListener('kitui-theme',()=>draw());   /* สลับธีมแล้ววาดลายใหม่ เส้นดำ<->ขาวตามพื้น */
  load(); fitPad();
}
function pt(e){
  const r=padCv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height,
          p:(e.pointerType==='pen'&&e.pressure>0)?e.pressure:0.5};   /* เก็บเป็นสัดส่วน 0-1 → resize แล้วลายไม่เพี้ยน */
}
function snap(){ histo.push(pages[pg].slice()); if(histo.length>60)histo.shift(); undone=[]; }
function erase(p){
  const r=padCv.getBoundingClientRect(), rad=18/r.width;
  const keep=pages[pg].filter(s=>!s.pts.some(q=>Math.hypot(q.x-p.x,(q.y-p.y)*(r.height/r.width))<rad));
  if(keep.length!==pages[pg].length){ pages[pg]=keep; draw(); save(); }
}
function fitPad(){
  const w=pad.querySelector('.kitui-padwrap').clientWidth, h=pad.querySelector('.kitui-padwrap').clientHeight;
  const dpr=Math.min(devicePixelRatio||1,2.5);
  padCv.width=Math.max(1,w*dpr); padCv.height=Math.max(1,h*dpr);
  draw();
}
function draw(){
  const W=padCv.width,H=padCv.height,dpr=Math.min(devicePixelRatio||1,2.5);
  padCx.clearRect(0,0,W,H);
  /* เส้นตารางจาง ๆ ให้เขียนตรง */
  const dark=R.getAttribute('data-theme')==='dark';
  padCx.strokeStyle=dark?'rgba(148,163,184,.14)':'rgba(100,116,139,.13)'; padCx.lineWidth=1;
  for(let y=28*dpr;y<H;y+=28*dpr){padCx.beginPath();padCx.moveTo(0,y);padCx.lineTo(W,y);padCx.stroke();}
  padCx.lineCap='round'; padCx.lineJoin='round';
  pages[pg].forEach(s=>{
    padCx.globalAlpha=s.hl?0.32:1;
    padCx.strokeStyle=(dark&&s.c==='#111827')?'#e5e9f0':s.c;
    for(let i=1;i<s.pts.length;i++){
      const a=s.pts[i-1],b=s.pts[i];
      padCx.lineWidth=(s.hl?s.w*4:s.w*(0.55+b.p))*dpr;
      padCx.beginPath(); padCx.moveTo(a.x*W,a.y*H); padCx.lineTo(b.x*W,b.y*H); padCx.stroke();
    }
    if(s.pts.length===1){ /* จุดเดียว */
      padCx.fillStyle=padCx.strokeStyle; padCx.beginPath();
      padCx.arc(s.pts[0].x*W,s.pts[0].y*H,(s.hl?s.w*2:s.w)*dpr,0,7); padCx.fill();
    }
  });
  padCx.globalAlpha=1;
  const n=D.getElementById('kitui-pgnum'); if(n)n.textContent=(pg+1)+'/'+pages.length;
}
function save(){ try{ localStorage.setItem('kitui-'+PADKEY, JSON.stringify(pages)); }catch(e){} }
function load(){
  try{ const j=JSON.parse(localStorage.getItem('kitui-'+PADKEY)); if(Array.isArray(j)&&j.length){pages=j;pg=0;} }catch(e){}
}

if(hasPen){
  buildPad();
  D.getElementById('kitui-penbtn').onclick=()=>{
    const o=pad.classList.toggle('open');
    D.getElementById('kitui-penbtn').classList.toggle('on',o);
    if(o) fitPad();
  };
}

/* =============================================================================
   5) เครื่องคิดเลขวิทยาศาสตร์  (tokenizer → shunting-yard → RPN  ไม่ใช้ eval)
   ============================================================================= */
const FN={sin:1,cos:1,tan:1,asin:1,acos:1,atan:1,ln:1,log:1,sqrt:1,abs:1,exp:1};
const PREC={'+':1,'-':1,'*':2,'/':2,'^':4,'u-':3};
function tokenize(s){
  s=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/√/g,'sqrt').replace(/π/g,'PI');
  const out=[]; const re=/(\d+\.?\d*|\.\d+|[A-Za-z]+|\*\*|[+\-*/^%!()])/g; let m;
  while((m=re.exec(s))) out.push(m[1]);
  return out;
}
function toRPN(tk){
  const out=[],op=[]; let prev=null;
  for(let t of tk){
    if(t==='**')t='^';
    if(/^[\d.]+$/.test(t)){ out.push(parseFloat(t)); }
    else if(t==='PI'){ out.push(Math.PI); }
    else if(t==='e'||t==='E'){ out.push(Math.E); }
    else if(t==='ANS'){ out.push(ANS); }
    else if(FN[t]){ op.push(t); }
    else if(t==='('){ op.push(t); }
    else if(t===')'){
      while(op.length&&op[op.length-1]!=='(') out.push(op.pop());
      if(!op.length) throw 0; op.pop();
      if(op.length&&FN[op[op.length-1]]) out.push(op.pop());
    }
    else if(t==='!'||t==='%'){ out.push(t==='!'?'fact':'pct'); }
    else if('+-*/^'.includes(t)){
      let o=t;
      const unary = (prev===null||prev==='('||'+-*/^'.includes(prev));
      if(t==='-'&&unary) o='u-';
      else if(t==='+'&&unary){ prev=t; continue; }
      while(op.length){
        const top=op[op.length-1];
        if(top==='('||FN[top])break;
        const rightAssoc=(o==='^'||o==='u-');
        if(PREC[top]>PREC[o] || (PREC[top]===PREC[o]&&!rightAssoc)) out.push(op.pop()); else break;
      }
      op.push(o);
    }
    else throw 0;
    prev=t;
  }
  while(op.length){ const o=op.pop(); if(o==='(')throw 0; out.push(o); }
  return out;
}
function evalRPN(rpn,deg){
  const st=[], D2R=deg?Math.PI/180:1, R2D=deg?180/Math.PI:1;
  const pop=()=>{ if(!st.length)throw 0; return st.pop(); };
  for(const t of rpn){
    if(typeof t==='number'){ st.push(t); continue; }
    if(t==='fact'){ const n=pop(); if(n<0||n>170||n!==Math.floor(n))throw 0; let r=1; for(let i=2;i<=n;i++)r*=i; st.push(r); continue; }
    if(t==='pct'){ st.push(pop()/100); continue; }
    if(t==='u-'){ st.push(-pop()); continue; }
    if(FN[t]){
      const a=pop();
      st.push( t==='sin'?Math.sin(a*D2R) : t==='cos'?Math.cos(a*D2R) : t==='tan'?Math.tan(a*D2R)
             : t==='asin'?Math.asin(a)*R2D : t==='acos'?Math.acos(a)*R2D : t==='atan'?Math.atan(a)*R2D
             : t==='ln'?Math.log(a) : t==='log'?Math.log10(a) : t==='sqrt'?Math.sqrt(a)
             : t==='abs'?Math.abs(a) : Math.exp(a) );
      continue;
    }
    const b=pop(),a=pop();
    st.push( t==='+'?a+b : t==='-'?a-b : t==='*'?a*b : t==='/'?a/b : Math.pow(a,b) );
  }
  if(st.length!==1) throw 0;
  return st[0];
}
function calc(src,deg){ return evalRPN(toRPN(tokenize(src)),deg); }

let ANS=0, expr='', calcSheet, isDeg=true;
const KEYS=[
 ['DEG','deg','fn'],['(','(',''],[')',')',''],['⌫','del','del'],['AC','ac','del'],
 ['sin','sin(','fn'],['cos','cos(','fn'],['tan','tan(','fn'],['π','π','fn'],['÷','÷','op'],
 ['sin⁻¹','asin(','fn'],['cos⁻¹','acos(','fn'],['tan⁻¹','atan(','fn'],['e','e','fn'],['×','×','op'],
 ['ln','ln(','fn'],['log','log(','fn'],['√','√(','fn'],['xʸ','^','fn'],['−','−','op'],
 ['7','7',''],['8','8',''],['9','9',''],['x!','!','fn'],['+','+','op'],
 ['4','4',''],['5','5',''],['6','6',''],['%','%','fn'],['ANS','ANS','fn'],
 ['1','1',''],['2','2',''],['3','3',''],['.','.',''],['=','eq','eq'],
 ['0','0','w3'],['x²','^2','fn']
];
function buildCalc(){
  calcSheet=el('div','kitui-sheet'); calcSheet.id='kitui-calc';
  calcSheet.innerHTML=
   `<div class="kitui-head"><b>🧮 เครื่องคิดเลขวิทยาศาสตร์</b><span class="kitui-spacer"></span>
      <button id="kitui-calcclose">✕</button></div>
    <div class="kitui-disp"><div class="ex" id="kitui-ex">&nbsp;</div><div class="rs" id="kitui-rs">0</div></div>
    <div class="kitui-keys" id="kitui-keys">
      ${KEYS.map(k=>`<button class="${k[2]}" data-k="${k[1].replace(/"/g,'&quot;')}">${k[0]}</button>`).join('')}
    </div>`;
  D.body.appendChild(calcSheet);
  D.getElementById('kitui-calcclose').onclick=()=>calcSheet.classList.remove('open');
  const ex=D.getElementById('kitui-ex'), rs=D.getElementById('kitui-rs');
  const show=()=>{ ex.textContent=expr||' ';
    try{ rs.textContent = expr? fmt(calc(expr,isDeg)) : '0'; rs.style.opacity=.62; }
    catch(e){ rs.style.opacity=.35; }
  };
  D.getElementById('kitui-keys').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return; const k=b.dataset.k;
    if(k==='ac'){ expr=''; rs.textContent='0'; ex.textContent=' '; return; }
    if(k==='del'){ expr=expr.slice(0,-1); show(); return; }
    if(k==='deg'){ isDeg=!isDeg; b.textContent=isDeg?'DEG':'RAD'; b.classList.toggle('on',!isDeg); show(); return; }
    if(k==='eq'){
      rs.style.opacity=1;
      try{
        const v=calc(expr,isDeg);
        if(Number.isNaN(v)){ rs.textContent='ไม่นิยาม (โดเมนไม่ถูก)'; return; }
        if(!isFinite(v)){ rs.textContent='หารด้วย 0 ไม่ได้'; return; }
        ANS=v; ex.textContent=expr+' ='; rs.textContent=fmt(v); expr=String(v);
      }catch(err){ rs.textContent='รูปแบบไม่ถูกต้อง'; }
      return;
    }
    expr+=k; show();
  });
}
function fmt(v){
  if(!isFinite(v)) return v>0?'∞':(v<0?'-∞':'ไม่นิยาม');
  if(Math.abs(v)>=1e12||(Math.abs(v)<1e-9&&v!==0)) return v.toExponential(8).replace(/e/,'×10^');
  return String(Math.round(v*1e10)/1e10);
}
if(hasCalc){
  buildCalc();
  D.getElementById('kitui-calcbtn').onclick=()=>{
    const o=calcSheet.classList.toggle('open');
    D.getElementById('kitui-calcbtn').classList.toggle('on',o);
  };
}
})();

</script>
